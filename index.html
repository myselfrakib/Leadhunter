import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAnalytics, logEvent } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-analytics.js";
import {
  getFirestore, collection, doc, addDoc, updateDoc, deleteDoc,
  getDocs, query, orderBy, serverTimestamp, onSnapshot, limit
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAlQsON2HFJM5mCRP18E_R_UGP_x3SXNI8",
  authDomain: "leahunter.firebaseapp.com",
  projectId: "leahunter",
  storageBucket: "leahunter.firebasestorage.app",
  messagingSenderId: "446558524955",
  appId: "1:446558524955:web:89356211f5b0286efe0abe",
  measurementId: "G-PV9X2BLHSL"
};
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
const db = getFirestore(app);
window.__fb = {
  trackEvent:(n,p={})=>{try{logEvent(analytics,n,p)}catch(e){}},
  addLead:async(lead)=>{const r=await addDoc(collection(db,"leads"),{...lead,status:"new",tags:[],score:0,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});return r.id},
  updateLead:async(id,u)=>{await updateDoc(doc(db,"leads",id),{...u,updatedAt:serverTimestamp()})},
  deleteLead:async(id)=>{await deleteDoc(doc(db,"leads",id))},
  subscribeLeads:(cb)=>onSnapshot(query(collection(db,"leads"),orderBy("createdAt","desc")),snap=>cb(snap.docs.map(d=>({id:d.id,...d.data()})))),
  addSearchHistory:async(s)=>{await addDoc(collection(db,"searches"),{...s,createdAt:serverTimestamp()})},
  getSearchHistory:async()=>{const sn=await getDocs(query(collection(db,"searches"),orderBy("createdAt","desc"),limit(20)));return sn.docs.map(d=>({id:d.id,...d.data()}))},
  addNote:async(lid,note)=>{const r=await addDoc(collection(db,"leads",lid,"notes"),{content:note,createdAt:serverTimestamp()});return r.id},
  getNotes:async(lid)=>{const sn=await getDocs(query(collection(db,"leads",lid,"notes"),orderBy("createdAt","asc")));return sn.docs.map(d=>({id:d.id,...d.data()}))},
  deleteNote:async(lid,nid)=>{await deleteDoc(doc(db,"leads",lid,"notes",nid))},
};
window.dispatchEvent(new Event("fb-ready"));
</script>

<!-- Google Maps — async + callback pattern (fixes ApiTargetBlockedMapError & loading=async warning) -->
<script>
window.__mapsCallbacks = [];
window.__mapsReady = false;
window.__onMapsReady = function() {
  window.__mapsReady = true;
  window.__mapsCallbacks.forEach(fn => fn());
  window.__mapsCallbacks = [];
  window.dispatchEvent(new Event("maps-ready"));
};
window.__loadMaps = function() {
  if (window.__mapsReady) return Promise.resolve();
  return new Promise((res, rej) => {
    if (window.__mapsReady) { res(); return; }
    window.__mapsCallbacks.push(res);
    if (document.querySelector('script[data-maps-loaded]')) return; // already injecting
    const s = document.createElement("script");
    s.setAttribute("data-maps-loaded","1");
    s.src = "https://maps.googleapis.com/maps/api/js?key=AIzaSyAlQsON2HFJM5mCRP18E_R_UGP_x3SXNI8&libraries=places,geometry&loading=async&callback=__onMapsReady";
    s.async = true; s.defer = true;
    s.onerror = rej;
    document.head.appendChild(s);
  });
};
</script>

// ─── Helpers ──────────────────────────────────────────────────────────────────
function scoreLeadData(lead) {
  let s = 0;
  if (lead.rating >= 4.5) s += 30; else if (lead.rating >= 4.0) s += 20; else if (lead.rating >= 3.5) s += 10;
  if (lead.user_ratings_total >= 100) s += 25; else if (lead.user_ratings_total >= 50) s += 15; else if (lead.user_ratings_total >= 20) s += 8;
  if (lead.website) s += 15;
  if (lead.phone || lead.international_phone_number) s += 10;
  if (lead.price_level > 0) s += 5;
  return Math.min(s, 99);
}
function scoreColor(s) { return s >= 70 ? "#00d68f" : s >= 45 ? "#ffb43a" : "#ff4d6d"; }
function getPos(loc) {
  if (!loc) return null;
  return { lat: typeof loc.lat==="function"?loc.lat():loc.lat, lng: typeof loc.lng==="function"?loc.lng():loc.lng };
}

// ─── Toast ────────────────────────────────────────────────────────────────────
let _toast = null;
function Toaster() {
  const [list, setList] = useState([]);
  useEffect(() => {
    _toast = (msg, type="info", dur=3200) => {
      const id = Date.now();
      setList(t => [...t.slice(-3), {id, msg, type}]);
      setTimeout(() => setList(t => t.filter(x => x.id !== id)), dur);
    };
  }, []);
  const C = {info:"var(--accent)",success:"var(--green)",error:"var(--red)",warning:"var(--gold)"};
  const I = {info:"ℹ",success:"✓",error:"✕",warning:"⚠"};
  return (
    <div style={{position:"fixed",bottom:20,right:20,zIndex:9999,display:"flex",flexDirection:"column",gap:8,pointerEvents:"none"}}>
      {list.map(t => (
        <div key={t.id} className="slide-up" style={{background:"var(--bg4)",border:`1px solid ${C[t.type]}33`,borderLeft:`3px solid ${C[t.type]}`,borderRadius:12,padding:"10px 16px",fontSize:13,color:"var(--text)",maxWidth:320,boxShadow:"0 8px 32px rgba(0,0,0,0.5)",display:"flex",alignItems:"center",gap:9}}>
          <span style={{color:C[t.type],fontSize:14,fontWeight:700}}>{I[t.type]}</span>
          <span>{t.msg}</span>
        </div>
      ))}
    </div>
  );
}
const toast = (m, t, d) => _toast?.(m, t, d);

// ─── Firebase hook ────────────────────────────────────────────────────────────
function useFirebase() {
  const [ready, setReady] = useState(!!window.__fb);
  useEffect(() => {
    if (window.__fb) { setReady(true); return; }
    const h = () => setReady(true);
    window.addEventListener("fb-ready", h);
    return () => window.removeEventListener("fb-ready", h);
  }, []);
  return ready ? window.__fb : null;
}

// ─── useLeads hook ────────────────────────────────────────────────────────────
function useLeads(fb) {
  const [leads, setLeads] = useState([]);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    if (!fb) return;
    return fb.subscribeLeads(data => { setLeads(data); setLoading(false); });
  }, [fb]);
  const saveLeads = useCallback(async (arr) => {
    if (!fb) return;
    await Promise.all(arr.map(l => fb.addLead({...l, score: scoreLeadData(l)})));
    fb.trackEvent("bulk_save", {count: arr.length});
  }, [fb]);
  const updateLead = useCallback(async (id, upd) => fb?.updateLead(id, upd), [fb]);
  const deleteLead = useCallback(async (id) => fb?.deleteLead(id), [fb]);
  return { leads, loading, saveLeads, updateLead, deleteLead };
}

// ─── useMaps hook — wraps window.__loadMaps ───────────────────────────────────
function useMaps() {
  const [ready, setReady] = useState(window.__mapsReady || false);
  const [error, setError] = useState(null);
  useEffect(() => {
    if (window.__mapsReady) { setReady(true); return; }
    const onReady = () => setReady(true);
    window.addEventListener("maps-ready", onReady);
    window.__loadMaps().catch(e => setError(e.message || "Failed to load Maps"));
    return () => window.removeEventListener("maps-ready", onReady);
  }, []);
  return { ready, error };
}

// ─── StatusBadge ─────────────────────────────────────────────────────────────
function StatusBadge({ status, onChange, compact }) {
  const cfg = STATUS_CONFIG[status] || STATUS_CONFIG.new;
  if (!onChange) return (
    <span style={{display:"inline-flex",alignItems:"center",gap:4,padding:compact?"2px 7px":"3px 10px",borderRadius:20,fontSize:10,fontWeight:700,color:cfg.color,background:cfg.bg,border:`1px solid ${cfg.color}33`}}>
      <span style={{fontSize:8}}>{cfg.icon}</span>{cfg.label}
    </span>
  );
  return (
    <select value={status} onChange={e=>{e.stopPropagation();onChange(e.target.value);}} onClick={e=>e.stopPropagation()}
      style={{fontSize:11,fontWeight:700,padding:"3px 8px",borderRadius:20,border:`1px solid ${cfg.color}44`,background:cfg.bg,color:cfg.color,cursor:"pointer",outline:"none",fontFamily:"var(--font-body)"}}>
      {Object.entries(STATUS_CONFIG).map(([v,c]) => <option key={v} value={v}>{c.label}</option>)}
    </select>
  );
}

function Stars({ rating, size=11 }) {
  if (!rating) return null;
  const full = Math.round(rating);
  return (
    <span style={{fontSize:size,color:"#ffb43a",letterSpacing:1}}>
      {"★".repeat(full)}{"☆".repeat(5-full)}
      <span style={{color:"var(--text2)",marginLeft:5,fontSize:size-1}}>{rating.toFixed(1)}</span>
    </span>
  );
}

function ScorePill({ score }) {
  if (score == null) return null;
  const c = scoreColor(score);
  return <span className="score-pill" style={{background:`${c}18`,color:c,border:`1px solid ${c}33`}}>⬡ {score}</span>;
}

// ─── Map ──────────────────────────────────────────────────────────────────────
function MapPane({ center, radius, leads, onSelect, selected }) {
  const ref = useRef(); const mapRef = useRef(); const circleRef = useRef();
  const markers = useRef([]); const iwRef = useRef();

  useEffect(() => {
    if (!ref.current || !window.google) return;
    mapRef.current = new window.google.maps.Map(ref.current, {
      center, zoom: 13,
      mapTypeControl: false, streetViewControl: false, fullscreenControl: true,
      zoomControl: true, gestureHandling: "greedy",
      zoomControlOptions: { position: window.google.maps.ControlPosition.RIGHT_BOTTOM },
      fullscreenControlOptions: { position: window.google.maps.ControlPosition.RIGHT_TOP },
      styles: DARK_MAP_STYLES,
    });
    iwRef.current = new window.google.maps.InfoWindow({ maxWidth: 240 });
  }, []);

  useEffect(() => {
    if (!mapRef.current || !window.google) return;
    mapRef.current.setCenter(center);
    if (circleRef.current) circleRef.current.setMap(null);
    circleRef.current = new window.google.maps.Circle({
      map: mapRef.current, center, radius: radius * 1000,
      fillColor: "#5b8fff", fillOpacity: 0.05,
      strokeColor: "#5b8fff", strokeOpacity: 0.35, strokeWeight: 1.5,
    });
    mapRef.current.fitBounds(circleRef.current.getBounds());
  }, [center, radius]);

  useEffect(() => {
    if (!mapRef.current || !window.google) return;
    markers.current.forEach(m => m.setMap(null));
    markers.current = [];
    leads.forEach(lead => {
      const pos = getPos(lead.geometry?.location);
      if (!pos) return;
      const cfg = STATUS_CONFIG[lead.status || "new"];
      const isSel = selected?.place_id === lead.place_id;
      const sc = lead.score || scoreLeadData(lead);
      const sc_color = scoreColor(sc);
      const m = new window.google.maps.Marker({
        map: mapRef.current, position: pos, title: lead.name,
        icon: {
          path: window.google.maps.SymbolPath.CIRCLE,
          scale: isSel ? 11 : 8,
          fillColor: isSel ? "#fff" : cfg.color,
          fillOpacity: 1,
          strokeColor: isSel ? cfg.color : "#070810",
          strokeWeight: isSel ? 3 : 2,
        },
        zIndex: isSel ? 100 : 1,
        animation: isSel ? window.google.maps.Animation.BOUNCE : null,
      });
      m.addListener("click", () => {
        onSelect(lead);
        iwRef.current.setContent(`
          <div style="font-family:'Outfit',sans-serif;padding:10px;max-width:220px;background:#111224;color:#eef0ff;border-radius:8px">
            <p style="margin:0 0 4px;font-weight:700;font-size:13px;line-height:1.3">${lead.name}</p>
            <p style="margin:0 0 8px;font-size:11px;color:#8892b4;line-height:1.4">${lead.vicinity||""}</p>
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              ${lead.rating ? `<span style="font-size:11px;color:#ffb43a">★ ${lead.rating}</span>` : ""}
              ${lead.user_ratings_total ? `<span style="font-size:10px;color:#6b7591">${lead.user_ratings_total} reviews</span>` : ""}
              <span style="font-size:10px;font-weight:700;color:${sc_color};background:${sc_color}18;padding:1px 6px;border-radius:10px">⬡ ${sc}</span>
            </div>
            ${lead.phone ? `<p style="margin:6px 0 0;font-size:11px;color:#5b8fff">📞 ${lead.phone}</p>` : ""}
          </div>
        `);
        iwRef.current.open(mapRef.current, m);
      });
      markers.current.push(m);
    });
  }, [leads, onSelect, selected]);

  return <div ref={ref} style={{width:"100%",height:"100%"}} />;
}

// ─── Location input — uses new PlaceAutocompleteElement with fallback ─────────
function LocationInput({ onPlace, value, onChange }) {
  const containerRef = useRef();
  const legacyRef = useRef();
  const { ready } = useMaps();

  useEffect(() => {
    if (!ready || !window.google) return;
    // Try new PlaceAutocompleteElement API first (2025+)
    if (window.google.maps.places.PlaceAutocompleteElement) {
      try {
        const el = new window.google.maps.places.PlaceAutocompleteElement({
          types: ["geocode", "establishment"],
        });
        el.style.width = "100%";
        // Clear the container and add the element
        if (containerRef.current) {
          containerRef.current.innerHTML = "";
          containerRef.current.appendChild(el);
          el.addEventListener("gmp-placeselect", async (e) => {
            const place = e.place;
            await place.fetchFields({ fields: ["location", "displayName", "formattedAddress"] });
            const lat = place.location?.lat?.() ?? place.location?.lat;
            const lng = place.location?.lng?.() ?? place.location?.lng;
            if (lat && lng) onPlace({ lat, lng }, place.formattedAddress || place.displayName?.text || "");
          });
        }
        return;
      } catch(e) { /* fall through to legacy */ }
    }
    // Fallback: legacy Autocomplete
    if (legacyRef.current && window.google.maps.places.Autocomplete) {
      const ac = new window.google.maps.places.Autocomplete(legacyRef.current, {
        types: ["geocode", "establishment"],
      });
      ac.addListener("place_changed", () => {
        const p = ac.getPlace();
        if (p.geometry) {
          onPlace(
            { lat: p.geometry.location.lat(), lng: p.geometry.location.lng() },
            p.formatted_address || p.name || ""
          );
        }
      });
    }
  }, [ready]);

  // If Maps API uses new element, render container div; else render plain input
  const usesNewAPI = ready && window.google?.maps?.places?.PlaceAutocompleteElement;

  return (
    <div style={{position:"relative"}}>
      {usesNewAPI
        ? <div ref={containerRef} style={{width:"100%"}} />
        : <input
            ref={legacyRef}
            className="input-field"
            value={value}
            onChange={e => onChange(e.target.value)}
            placeholder="City, address, or place name…"
            style={{paddingRight:36}}
          />
      }
    </div>
  );
}

// ─── Detail Drawer ────────────────────────────────────────────────────────────
function DetailDrawer({ lead, onClose, onUpdate, onDelete, fb }) {
  const [details, setDetails] = useState(null);
  const [notes, setNotes] = useState([]);
  const [newNote, setNewNote] = useState("");
  const [tags, setTags] = useState([]);
  const [newTag, setNewTag] = useState("");
  const [loadingDet, setLoadingDet] = useState(false);
  const [activeTab, setActiveTab] = useState("info");
  const [deleting, setDeleting] = useState(false);

  useEffect(() => {
    if (!lead) return;
    setTags(lead.tags||[]); setDetails(null); setNotes([]); setActiveTab("info");
    if (window.google?.maps?.places && lead.place_id) {
      setLoadingDet(true);
      const svc = new window.google.maps.places.PlacesService(document.createElement("div"));
      svc.getDetails(
        { placeId: lead.place_id, fields: ["name","formatted_phone_number","website","opening_hours","price_level","url","rating","user_ratings_total","formatted_address","business_status"] },
        (r, s) => { if (s === "OK") setDetails(r); setLoadingDet(false); }
      );
    }
    if (fb && lead.id) fb.getNotes(lead.id).then(setNotes).catch(() => {});
  }, [lead?.id]);

  if (!lead) return null;
  const sc = lead.score || scoreLeadData(lead);
  const sc_color = scoreColor(sc);

  const addNote = async () => {
    if (!newNote.trim() || !fb) return;
    const id = await fb.addNote(lead.id, newNote.trim());
    setNotes(n => [...n, {id, content: newNote.trim(), createdAt: {toDate: () => new Date()}}]);
    setNewNote(""); toast("Note saved","success");
  };
  const addTag = () => {
    if (!newTag.trim()) return;
    const upd = [...new Set([...tags, newTag.trim().toLowerCase()])];
    setTags(upd); onUpdate(lead.id, {tags: upd}); setNewTag(""); toast("Tag added","success");
  };
  const handleDelete = async () => {
    if (!window.confirm(`Delete "${lead.name}" from pipeline?`)) return;
    setDeleting(true);
    await onDelete(lead.id);
    onClose(); toast("Lead deleted","warning");
  };

  return (
    <div className="slide-in-right" style={{position:"absolute",inset:0,background:"var(--bg2)",zIndex:100,display:"flex",flexDirection:"column",borderLeft:"1px solid var(--border)"}}>
      {/* Header */}

        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
          <div style={{flex:1,minWidth:0,paddingRight:10}}>
            <h2 style={{fontFamily:"var(--font-head)",fontSize:15,fontWeight:700,color:"var(--text)",marginBottom:3,lineHeight:1.3}}>{lead.name}</h2>
            <p style={{fontSize:11,color:"var(--text2)",lineHeight:1.4}}>{lead.vicinity}</p>
          </div>
          <button onClick={onClose} className="btn btn-ghost btn-icon">✕</button>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          <StatusBadge status={lead.status||"new"} onChange={s => onUpdate(lead.id, {status:s})} />
          <div style={{display:"flex",alignItems:"center",gap:5,padding:"3px 9px",borderRadius:20,background:`${sc_color}15`,border:`1px solid ${sc_color}30`}}>
            <div style={{width:18,height:18,borderRadius:"50%",background:`conic-gradient(${sc_color} ${sc}%, var(--surface) 0)`,display:"flex",alignItems:"center",justifyContent:"center"}}>
              <div style={{width:11,height:11,borderRadius:"50%",background:"var(--bg2)"}}/>
            </div>
            <span style={{fontSize:11,fontWeight:700,color:sc_color,fontFamily:"var(--font-mono)"}}>{sc}</span>
            <span style={{fontSize:9,color:"var(--text3)"}}>score</span>

// ─── Search Panel ─────────────────────────────────────────────────────────────
function SearchPanel({ onResults, onCenterChange, fb, onSearchStart }) {
  const [loc, setLoc] = useState("");
  const [coords, setCoords] = useState(null);
  const [radius, setRadius] = useState(2);
  const [type, setType] = useState("restaurant");
  const [keyword, setKeyword] = useState("");
  const [minRating, setMinRating] = useState(0);
  const [searching, setSearching] = useState(false);
  const [progress, setProgress] = useState(0);
  const [count, setCount] = useState(null);
  const [history, setHistory] = useState([]);
  const [showHistory, setShowHistory] = useState(false);
  const { ready: mapsReady, error: mapsError } = useMaps();

  useEffect(() => {
    if (fb) fb.getSearchHistory().then(setHistory).catch(() => {});
  }, [fb]);

  const handlePlace = useCallback((c, address) => {
    setCoords(c);
    setLoc(address || "");
    onCenterChange(c);
  }, [onCenterChange]);

  const useMyLocation = () => {
    if (!navigator.geolocation) { toast("Geolocation not supported","error"); return; }
    navigator.geolocation.getCurrentPosition(pos => {
      const c = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      setCoords(c); onCenterChange(c); setLoc("📍 My Location");
      toast("Location detected!","success");
    }, () => toast("Location access denied","error"));
  };

  const doSearch = async () => {
    if (!coords) { toast("Select a location from the dropdown first","warning"); return; }
    if (!mapsReady) { toast(mapsError||"Maps API not ready","error"); return; }
    setSearching(true); setCount(null); setProgress(10); onSearchStart?.();
    try {
      const ll = new window.google.maps.LatLng(coords.lat, coords.lng);
      const svc = new window.google.maps.places.PlacesService(document.createElement("div"));
      const req = { location: ll, radius: radius * 1000, type };
      if (keyword.trim()) req.keyword = keyword.trim();
      setProgress(30);
      const { results, pagination } = await new Promise((res, rej) =>
        svc.nearbySearch(req, (r, s, p) =>
          s === "OK" || s === "ZERO_RESULTS" ? res({results: r||[], pagination: p}) : rej(new Error(s))
        )
      );
      setProgress(60);
      let all = [...results];
      if (pagination?.hasNextPage) {
        setProgress(72);
        const more = await new Promise(res =>
          setTimeout(() => pagination.nextPage((r, s) => res(s === "OK" ? r : [])), 2000)
        );
        all = [...all, ...more];
      }
      setProgress(88);
      if (minRating > 0) all = all.filter(r => (r.rating||0) >= minRating);
      const enriched = all.map(r => ({...r, score: scoreLeadData(r)}));
      enriched.sort((a, b) => (b.score||0) - (a.score||0));
      setProgress(100);
      setCount(enriched.length);
      onResults(enriched, coords, radius);
      fb?.addSearchHistory({ location: loc, coords, radius, type, keyword, minRating, resultCount: enriched.length }).catch(()=>{});
      fb?.trackEvent("search", {type, radius, count: enriched.length});
      toast(`Found ${enriched.length} businesses — sorted by score!`, "success");
    } catch(err) {
      toast("Search failed: " + err.message, "error");
    } finally {
      setSearching(false);
      setTimeout(() => setProgress(0), 800);
    }
  };

  return (
    <div style={{display:"flex",flexDirection:"column",height:"100%",position:"relative"}}>
      {/* Progress bar */}
      {progress > 0 && (
        <div className="progress-bar" style={{position:"absolute",top:0,left:0,right:0,zIndex:10}}>
          <div className="progress-fill" style={{width:`${progress}%`,background:"linear-gradient(90deg,var(--accent),var(--cyan))"}} />
        </div>
      )}
      <div className="scroll-area" style={{flex:1,padding:"14px 14px 8px"}}>
        {/* Logo */}
        <div style={{marginBottom:14,paddingBottom:13,borderBottom:"1px solid var(--border)"}}>
          <div style={{display:"flex",alignItems:"center",gap:9,marginBottom:4}}>
            <div style={{width:32,height:32,borderRadius:10,background:"linear-gradient(135deg,var(--accent),#3d6ee8)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,boxShadow:"var(--glow-accent)"}}>🎯</div>
            <div>
              <p style={{fontSize:15,fontWeight:800,fontFamily:"var(--font-head)",color:"var(--text)",letterSpacing:"-0.02em",lineHeight:1}}>
                LeadHunter<span style={{color:"var(--accent)"}}>Pro</span>
              </p>
              <p style={{fontSize:9,color:"var(--text3)",letterSpacing:"0.1em",textTransform:"uppercase",marginTop:1}}>Smart Lead Finder</p>
            </div>
          </div>
          {mapsError && (
            <div style={{fontSize:10,color:"var(--red)",background:"var(--red2)",border:"1px solid rgba(255,77,109,0.25)",padding:"5px 9px",borderRadius:7,marginTop:6,lineHeight:1.5}}>
              ⚠ Maps API issue — check key restrictions in Google Cloud Console
            </div>
          )}
          {!fb && (
            <div style={{fontSize:10,color:"var(--gold)",background:"var(--gold2)",border:"1px solid rgba(255,180,58,0.25)",padding:"4px 8px",borderRadius:7,marginTop:6,display:"inline-flex",alignItems:"center",gap:4}}>
              <span className="pulse" style={{width:5,height:5,borderRadius:"50%",background:"var(--gold)",display:"inline-block"}}/>
              Connecting to database…
            </div>
          )}
        </div>

        {/* Location */}
        <div style={{marginBottom:11}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:7}}>
            <label className="sidebar-label" style={{marginBottom:0}}>📍 Location</label>
            <button onClick={useMyLocation} style={{background:"none",border:"none",cursor:"pointer",color:"var(--accent)",fontSize:11,padding:0,fontFamily:"var(--font-body)"}}>⊕ Use mine</button>
          </div>
          <LocationInput onPlace={handlePlace} value={loc} onChange={setLoc} />
          {coords && <p style={{fontSize:10,color:"var(--green)",marginTop:4}}>✓ Location set</p>}
        </div>

        {/* Business Type */}
        <div style={{marginBottom:11}}>
          <label className="sidebar-label">🏢 Business Type</label>
          <select className="input-field" value={type} onChange={e=>setType(e.target.value)} style={{background:"var(--surface)"}}>
            {BUSINESS_CATEGORIES.map(g => (
              <optgroup key={g.group} label={g.group}>
                {g.types.map(t => <option key={t.value} value={t.value}>{t.icon} {t.label}</option>)}
              </optgroup>
            ))}
          </select>
        </div>

        {/* Keyword */}
        <div style={{marginBottom:11}}>
          <label className="sidebar-label">🔤 Keyword <span style={{fontWeight:400,textTransform:"none"}}>(optional)</span></label>
          <input className="input-field" value={keyword} onChange={e=>setKeyword(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doSearch()} placeholder="e.g. Italian, luxury, 24hr…" />
        </div>

        {/* Radius */}
        <div style={{marginBottom:11}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
            <label className="sidebar-label" style={{marginBottom:0}}>📏 Search Radius</label>
            <span style={{fontSize:12,fontWeight:700,color:"var(--accent)",fontFamily:"var(--font-mono)"}}>{radius} km</span>
          </div>
          <input type="range" min="0.5" max="50" step="0.5" value={radius} onChange={e=>setRadius(+e.target.value)}
            style={{width:"100%",accentColor:"var(--accent)",cursor:"pointer",height:4}} />
          <div style={{display:"flex",justifyContent:"space-between",marginTop:3}}>
            <span style={{fontSize:10,color:"var(--text4)"}}>0.5 km</span>
            <span style={{fontSize:10,color:"var(--text4)"}}>50 km</span>
          </div>
        </div>

        {/* Min Rating */}
        <div style={{marginBottom:14}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
            <label className="sidebar-label" style={{marginBottom:0}}>⭐ Min Rating</label>
            <span style={{fontSize:12,fontWeight:700,color:"var(--gold)",fontFamily:"var(--font-mono)"}}>{minRating>0?`${minRating}+`:"Any"}</span>
          </div>
          <div style={{display:"flex",gap:5}}>
            {[0,3,3.5,4,4.5].map(v => (
              <button key={v} onClick={()=>setMinRating(v)}
                style={{flex:1,padding:"5px 3px",borderRadius:7,border:`1px solid ${minRating===v?"var(--gold)":"var(--border)"}`,background:minRating===v?"var(--gold2)":"var(--surface)",color:minRating===v?"var(--gold)":"var(--text3)",fontSize:10,fontWeight:600,cursor:"pointer",fontFamily:"var(--font-body)"}}>
                {v===0?"Any":`${v}★`}
              </button>
            ))}
          </div>
        </div>

        {/* Search Button */}
        <button onClick={doSearch} disabled={searching} className="btn btn-primary"
          style={{width:"100%",padding:12,fontSize:13,fontWeight:700,letterSpacing:"0.02em",marginBottom:10}}>
          {searching
            ? <><div style={{width:14,height:14,border:"2px solid rgba(255,255,255,0.3)",borderTop:"2px solid #fff",borderRadius:"50%"}} className="spin"/> Scanning area…</>
            : <><span style={{fontSize:15}}>🎯</span> Hunt Leads</>
          }
        </button>

        {/* Result count */}
        {count !== null && (
          <div className="fade-in" style={{background:"linear-gradient(135deg,var(--accent3),var(--cyan3))",border:"1px solid var(--accent2)",borderRadius:"var(--r)",padding:"12px 14px",textAlign:"center",marginBottom:12}}>
            <p style={{fontSize:26,fontWeight:800,fontFamily:"var(--font-head)",color:"var(--accent)",lineHeight:1}}>{count}</p>
            <p style={{fontSize:10,color:"var(--text2)",marginTop:2}}>businesses found &amp; scored</p>
          </div>
        )}

        {/* Search History */}
        <div>
          <button onClick={()=>setShowHistory(p=>!p)}
            style={{width:"100%",background:"none",border:"none",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",color:"var(--text3)",fontSize:11}}>
            <span style={{fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em"}}>🕐 Search History</span>
            <span>{showHistory?"▲":"▼"}</span>
          </button>
          {showHistory && history.length > 0 && (
            <div style={{display:"flex",flexDirection:"column",gap:4,marginTop:6}}>
              {history.slice(0,8).map(h => (
                <button key={h.id} onClick={()=>{
                  setLoc(h.location||""); setCoords(h.coords);
                  setRadius(h.radius||2); setType(h.type||"restaurant");
                  setKeyword(h.keyword||""); setMinRating(h.minRating||0);
                  if (h.coords) onCenterChange(h.coords);
                }} className="btn btn-ghost" style={{justifyContent:"flex-start",fontSize:11,padding:"6px 9px",textAlign:"left"}}>
                  <div style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",flex:1}}>
                    <span style={{color:"var(--text)"}}>{h.location||"Unknown"}</span>
                    <span style={{color:"var(--text3)",marginLeft:6}}>{h.type} · {h.radius}km</span>
                  </div>
                  {h.resultCount != null && <span style={{fontSize:10,color:"var(--accent)",marginLeft:6,flexShrink:0}}>{h.resultCount}</span>}
                </button>
              ))}
            </div>
          )}
          {showHistory && history.length === 0 && <p style={{fontSize:11,color:"var(--text3)",padding:"8px 0"}}>No history yet</p>}
        </div>
      </div>
    </div>
  );
}

// ─── Pipeline Stats ───────────────────────────────────────────────────────────
function PipelineStats({ leads }) {
  const counts = useMemo(() => {
    const c = {total: leads.length, avgScore: 0};
    Object.keys(STATUS_CONFIG).forEach(s => c[s] = 0);
    let tot = 0;
    leads.forEach(l => { const s = l.status||"new"; c[s] = (c[s]||0)+1; tot += (l.score||0); });
    c.avgScore = leads.length ? Math.round(tot/leads.length) : 0;
    return c;
  }, [leads]);

  return (
    <div style={{padding:"7px 14px",borderBottom:"1px solid var(--border)",display:"flex",gap:6,overflowX:"auto",flexShrink:0,alignItems:"center"}}>
      <div style={{display:"flex",gap:12,paddingRight:10,borderRight:"1px solid var(--border)",flexShrink:0,marginRight:2}}>
        <div>
          <p style={{fontSize:15,fontWeight:800,fontFamily:"var(--font-head)",color:"var(--text)",lineHeight:1}}>{counts.total}</p>
          <p style={{fontSize:9,color:"var(--text3)",textTransform:"uppercase",letterSpacing:"0.06em"}}>Total</p>
        </div>
        <div>
          <p style={{fontSize:15,fontWeight:800,fontFamily:"var(--font-head)",color:scoreColor(counts.avgScore),lineHeight:1}}>{counts.avgScore}</p>
          <p style={{fontSize:9,color:"var(--text3)",textTransform:"uppercase",letterSpacing:"0.06em"}}>Avg Score</p>
        </div>
      </div>
      {Object.entries(STATUS_CONFIG).map(([s,cfg]) => counts[s] > 0 && (
        <div key={s} style={{display:"flex",alignItems:"center",gap:5,padding:"3px 9px",borderRadius:20,background:cfg.bg,border:`1px solid ${cfg.color}33`,flexShrink:0}}>
          <span style={{fontSize:13,fontWeight:800,fontFamily:"var(--font-head)",color:cfg.color}}>{counts[s]}</span>
          <span style={{fontSize:9,color:cfg.color,opacity:0.8}}>{cfg.label}</span>
        </div>
      ))}
    </div>
  );
}

// ─── App ──────────────────────────────────────────────────────────────────────
function App() {
  const fb = useFirebase();
  const { leads, loading, saveLeads, updateLead, deleteLead } = useLeads(fb);
  const { ready: mapsReady, error: mapsError } = useMaps();
  const [center, setCenter] = useState({lat:40.7128,lng:-74.006});
  const [radius, setRadius] = useState(2);
  const [results, setResults] = useState([]);
  const [selected, setSelected] = useState(null);
  const [tab, setTab] = useState("search");
  const [view, setView] = useState("split");
  const [filterStatus, setFilterStatus] = useState("all");
  const [filterText, setFilterText] = useState("");
  const [sort, setSort] = useState("score");
  const [saving, setSaving] = useState(false);
  const [checkedIds, setCheckedIds] = useState(new Set());
  const [showCheck, setShowCheck] = useState(false);

  const handleResults = useCallback((r, c, rad) => {
    setResults(r); setCenter(c); setRadius(rad); setTab("search"); setSelected(null); setCheckedIds(new Set());
  }, []);

  const handleSaveAll = async () => {
    if (!results.length || !fb) return;
    setSaving(true);
    try {
      await saveLeads(results.map(r => ({
        name: r.name, vicinity: r.vicinity||"",
        rating: r.rating||null, user_ratings_total: r.user_ratings_total||null,
        place_id: r.place_id, types: r.types||[],
        website: r.website||"", phone: r.international_phone_number||"",
        score: scoreLeadData(r),
        geometry: { location: getPos(r.geometry?.location) }
      })));
      toast(`${results.length} leads saved to pipeline!`, "success");
      setTab("leads"); setResults([]);
    } catch(e) { toast("Save failed: "+e.message, "error"); }
    finally { setSaving(false); }
  };

  const handleSaveSelected = async () => {
    if (!fb || checkedIds.size === 0) return;
    setSaving(true);
    try {
      const toSave = results.filter(r => checkedIds.has(r.place_id)).map(r => ({
        name: r.name, vicinity: r.vicinity||"",
        rating: r.rating||null, user_ratings_total: r.user_ratings_total||null,
        place_id: r.place_id, types: r.types||[],
        website: r.website||"", phone: r.international_phone_number||"",
        score: scoreLeadData(r),
        geometry: { location: getPos(r.geometry?.location) }
      }));
      await saveLeads(toSave);
      toast(`${toSave.length} selected leads saved!`, "success");
      setTab("leads"); setResults([]);
    } catch(e) { toast("Save failed","error"); }
    finally { setSaving(false); }
  };

  const exportCSV = () => {
    const src = tab==="search" ? display : filteredLeads;
    if (!src.length) { toast("Nothing to export","warning"); return; }
    const rows = [["Name","Address","Rating","Reviews","Score","Status","Phone","Website","Tags"]];
    src.forEach(l => rows.push([l.name,l.vicinity||"",l.rating||"",l.user_ratings_total||"",l.score||scoreLeadData(l),l.status||"new",l.phone||"",l.website||"",(l.tags||[]).join("; ")]));
    const csv = rows.map(r => r.map(c => `"${String(c||"").replace(/"/g,'""')}"`).join(",")).join("\n");
    const a = document.createElement("a");
    a.href = "data:text/csv;charset=utf-8," + encodeURIComponent(csv);
    a.download = `leadhunter-${Date.now()}.csv`;
    a.click();
    toast("CSV exported!","success");
  };

  const bulkStatusUpdate = async (newStatus) => {
    if (!fb || checkedIds.size === 0) return;
    await Promise.all(Array.from(checkedIds).map(id => updateLead(id, {status:newStatus})));
    toast(`${checkedIds.size} leads updated to ${STATUS_CONFIG[newStatus].label}`, "success");
    setCheckedIds(new Set());
  };

  const bulkDelete = async () => {
    if (!fb || checkedIds.size === 0) return;
    if (!window.confirm(`Delete ${checkedIds.size} leads?`)) return;
    await Promise.all(Array.from(checkedIds).map(id => deleteLead(id)));
    toast(`${checkedIds.size} leads deleted`, "warning");
    setCheckedIds(new Set());
  };

  const sortedResults = useMemo(() => {
    const list = [...results];
    if (sort==="score") list.sort((a,b)=>(b.score||scoreLeadData(b))-(a.score||scoreLeadData(a)));
    else if (sort==="rating") list.sort((a,b)=>(b.rating||0)-(a.rating||0));
    else if (sort==="reviews") list.sort((a,b)=>(b.user_ratings_total||0)-(a.user_ratings_total||0));
    else if (sort==="name") list.sort((a,b)=>a.name.localeCompare(b.name));
    return list;
  }, [results, sort]);

  const filteredLeads = useMemo(() => {
    let list = [...leads];
    if (filterStatus !== "all") list = list.filter(l => (l.status||"new") === filterStatus);
    if (filterText) {
      const q = filterText.toLowerCase();
      list = list.filter(l => l.name?.toLowerCase().includes(q) || l.vicinity?.toLowerCase().includes(q) || (l.tags||[]).some(t => t.includes(q)));
    }
    if (sort==="score") list.sort((a,b)=>(b.score||0)-(a.score||0));
    else if (sort==="rating") list.sort((a,b)=>(b.rating||0)-(a.rating||0));
    else if (sort==="reviews") list.sort((a,b)=>(b.user_ratings_total||0)-(a.user_ratings_total||0));
    else if (sort==="name") list.sort((a,b)=>a.name.localeCompare(b.name));
    return list;
  }, [leads, filterStatus, filterText, sort]);

  const display = tab === "search" ? sortedResults : filteredLeads;
  const allIds = tab === "search" ? results.map(r => r.place_id) : filteredLeads.map(l => l.id);
  const allSelected = allIds.length > 0 && allIds.every(id => checkedIds.has(id));

  return (
    <>
      <Toaster/>
      <div style={{height:"100vh",display:"flex",flexDirection:"column",background:"var(--bg)",overflow:"hidden",position:"relative",zIndex:1}}>

        {/* Topbar */}
        <div style={{height:50,background:"var(--bg2)",borderBottom:"1px solid var(--border)",display:"flex",alignItems:"center",padding:"0 14px",gap:10,flexShrink:0}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginRight:6}}>
            <div style={{width:30,height:30,borderRadius:9,background:"linear-gradient(135deg,var(--accent),#2f5dcc)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,boxShadow:"var(--glow-accent)"}}>🎯</div>
            <span style={{fontFamily:"var(--font-head)",fontWeight:800,fontSize:15,color:"var(--text)",letterSpacing:"-0.02em"}}>
              LeadHunter<span style={{color:"var(--accent)"}}>Pro</span>
            </span>
            {!fb && (
              <span style={{fontSize:9,color:"var(--gold)",background:"var(--gold2)",border:"1px solid rgba(255,180,58,0.3)",padding:"2px 7px",borderRadius:8,display:"flex",alignItems:"center",gap:3}}>
                <span className="spin" style={{width:8,height:8,border:"1.5px solid rgba(255,180,58,0.3)",borderTop:"1.5px solid var(--gold)",borderRadius:"50%",display:"inline-block"}}/>
                CONNECTING
              </span>
            )}
          </div>
          {/* View toggle */}
          <div style={{display:"flex",background:"var(--surface)",border:"1px solid var(--border)",borderRadius:10,padding:3,gap:2}}>
            {[["split","⚡","Split"],["map","🗺","Map"],["list","≡","List"]].map(([v,icon,label]) => (
              <button key={v} onClick={()=>setView(v)} title={label}
                style={{background:view===v?"var(--accent)":"transparent",color:view===v?"#fff":"var(--text3)",border:"none",borderRadius:7,padding:"4px 11px",fontSize:13,cursor:"pointer",transition:"all 0.15s",fontFamily:"var(--font-body)",fontWeight:view===v?700:400}}>
                {icon}
              </button>
            ))}
          </div>
          <div style={{flex:1}}/>
          <div style={{display:"flex",gap:6,alignItems:"center"}}>
            {tab==="search" && results.length > 0 && <>
              {checkedIds.size > 0 && (
                <button onClick={handleSaveSelected} disabled={saving||!fb} className="btn btn-success btn-sm">
                  {saving?"…":`💾 Save ${checkedIds.size}`}
                </button>
              )}
              <button onClick={handleSaveAll} disabled={saving||!fb} className="btn btn-primary btn-sm" style={{fontSize:12}}>
                {saving
                  ? <><div style={{width:12,height:12,border:"1.5px solid rgba(255,255,255,0.3)",borderTop:"1.5px solid #fff",borderRadius:"50%"}} className="spin"/>Saving…</>
                  : `💾 Save All (${results.length})`
                }
              </button>
            </>}
            <button onClick={exportCSV} className="btn btn-ghost" style={{fontSize:11,padding:"5px 12px"}}>↓ CSV</button>
          </div>
        </div>

        {/* Body */}
        <div style={{flex:1,display:"flex",overflow:"hidden"}}>
          {/* Sidebar */}
          <div style={{width:250,flexShrink:0,borderRight:"1px solid var(--border)",background:"var(--bg2)",display:"flex",flexDirection:"column",overflow:"hidden",position:"relative"}}>
            <SearchPanel onResults={handleResults} onCenterChange={setCenter} fb={fb} onSearchStart={()=>setSelected(null)}/>
          </div>

          {/* Main */}
          <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
            {/* Tabs */}
            <div style={{display:"flex",borderBottom:"1px solid var(--border)",background:"var(--bg2)",flexShrink:0,alignItems:"center",paddingLeft:2}}>
              <button className={`tab-btn${tab==="search"?" active":""}`} onClick={()=>{setTab("search");setSelected(null);}}>
                🔍 Results {results.length>0&&<span className="badge">{results.length}</span>}
              </button>
              <button className={`tab-btn${tab==="leads"?" active":""}`} onClick={()=>{setTab("leads");setSelected(null);}}>
                💼 Pipeline {leads.length>0&&<span className="badge">{leads.length}</span>}
              </button>
              {tab==="leads" && (
                <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:6,paddingRight:10}}>
                  <select className="input-field" value={filterStatus} onChange={e=>setFilterStatus(e.target.value)}
                    style={{width:116,height:28,fontSize:11,padding:"4px 8px",background:"var(--surface)"}}>
                    <option value="all">All Status</option>
                    {Object.entries(STATUS_CONFIG).map(([v,c])=><option key={v} value={v}>{c.label}</option>)}
                  </select>
                </div>
              )}
            </div>

            {tab === "leads" && <PipelineStats leads={leads}/>}
            {showCheck && <BulkActionsBar selected={checkedIds} onStatusChange={bulkStatusUpdate} onDelete={bulkDelete} onClear={()=>setCheckedIds(new Set())}/>}

            {/* Pane */}
            <div style={{flex:1,display:"flex",overflow:"hidden",position:"relative"}}>
              {(view==="split"||view==="map") && (
                <div style={{flex:view==="map"?1:"0 0 54%",position:"relative",overflow:"hidden",borderRight:view==="split"?"1px solid var(--border)":"none"}}>
                  {mapsReady
                    ? <MapPane center={center} radius={radius} leads={display} onSelect={setSelected} selected={selected}/>
                    : <MapPlaceholder mapsError={mapsError}/>
                  }
                </div>
              )}
              {(view==="split"||view==="list") && (
                <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden",background:"var(--bg2)",position:"relative"}}>
                  <ResultsToolbar
                    count={display.length} sort={sort} onSortChange={setSort}
                    filterText={filterText} onFilter={setFilterText} tab={tab}
                    onSelectAll={(v)=>v ? setCheckedIds(new Set(allIds)) : setCheckedIds(new Set())}
                    allSelected={allSelected} showCheck={showCheck}
                    onToggleCheck={()=>{setShowCheck(p=>!p);setCheckedIds(new Set());}}
                  />
                  <div className="scroll-area" style={{flex:1,position:"relative"}}>
                    {display.length === 0
                      ? <EmptyState tab={tab} loading={loading}/>
                      : (
                        <div className="stagger" style={{padding:"9px 9px"}}>
                          {display.map(lead => (
                            <LeadCard key={lead.id||lead.place_id} lead={lead}
                              selected={selected?.place_id===lead.place_id}
                              onClick={()=>setSelected(selected?.place_id===lead.place_id?null:lead)}
                              onStatus={(id,s)=>updateLead(id,{status:s})}
                              checked={checkedIds.has(lead.id||lead.place_id)}
                              onCheck={v=>{
                                const id = lead.id||lead.place_id;
                                setCheckedIds(prev=>{const n=new Set(prev);v?n.add(id):n.delete(id);return n;});
                              }}
                              showCheck={showCheck}
                            />
                          ))}
                        </div>
                      )
                    }
                    {selected && (
                      <div style={{position:"absolute",inset:0}}>
                        <DetailDrawer lead={selected} onClose={()=>setSelected(null)} onUpdate={updateLead} onDelete={deleteLead} fb={fb}/>
                      </div>
                    )}
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
