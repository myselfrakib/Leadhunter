<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, collection, doc, addDoc, updateDoc, deleteDoc,
  getDocs, query, orderBy, serverTimestamp, onSnapshot, limit, where
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyAlQsON2HFJM5mCRP18E_R_UGP_x3SXNI8",
  authDomain: "leahunter.firebaseapp.com",
  projectId: "leahunter",
  storageBucket: "leahunter.firebasestorage.app",
  messagingSenderId: "446558524955",
  appId: "1:446558524955:web:89356211f5b0286efe0abe"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
window.__fb = {
  addLead: async (lead) => {
    const existing = await getDocs(query(collection(db,"leads"), where("place_id","==",lead.place_id)));
    if (!existing.empty) return existing.docs[0].id;
    const r = await addDoc(collection(db,"leads"),{...lead,status:"new",tags:[],score:lead.score||0,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});
    return r.id;
  },
  updateLead: async (id, u) => { await updateDoc(doc(db,"leads",id),{...u,updatedAt:serverTimestamp()}); },
  deleteLead: async (id) => { await deleteDoc(doc(db,"leads",id)); },
  subscribeLeads: (cb) => onSnapshot(query(collection(db,"leads"),orderBy("createdAt","desc")), snap => cb(snap.docs.map(d=>({id:d.id,...d.data()})))),
  addSearchHistory: async (s) => { await addDoc(collection(db,"searches"),{...s,createdAt:serverTimestamp()}); },
  getSearchHistory: async () => { const sn = await getDocs(query(collection(db,"searches"),orderBy("createdAt","desc"),limit(20))); return sn.docs.map(d=>({id:d.id,...d.data()})); },
  addNote: async (lid, note) => { const r = await addDoc(collection(db,"leads",lid,"notes"),{content:note,createdAt:serverTimestamp()}); return r.id; },
  getNotes: async (lid) => { const sn = await getDocs(query(collection(db,"leads",lid,"notes"),orderBy("createdAt","asc"))); return sn.docs.map(d=>({id:d.id,...d.data()})); },
  deleteNote: async (lid, nid) => { await deleteDoc(doc(db,"leads",lid,"notes",nid)); },
};
window.dispatchEvent(new Event("fb-ready"));
</script>

<!-- Google Maps -->
<script>
window.__mapsCallbacks = [];
window.__mapsReady = false;
window.__onMapsReady = function() {
  window.__mapsReady = true;
  window.__mapsCallbacks.forEach(fn => fn());
  window.__mapsCallbacks = [];
  window.dispatchEvent(new Event("maps-ready"));
};
window.__loadMaps = function() {
  if (window.__mapsReady) return Promise.resolve();
  return new Promise((res, rej) => {
    if (window.__mapsReady) { res(); return; }
    window.__mapsCallbacks.push(res);
    if (document.querySelector('script[data-maps-loaded]')) return;
    const s = document.createElement("script");
    s.setAttribute("data-maps-loaded","1");
    s.src = "https://maps.googleapis.com/maps/api/js?key=AIzaSyAlQsON2HFJM5mCRP18E_R_UGP_x3SXNI8&libraries=places,geometry&loading=async&callback=__onMapsReady&v=weekly";
    s.async = true; s.defer = true;
    s.onerror = rej;
    document.head.appendChild(s);
  });
};
</script>

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

  --bg:#0a0d14;

  --card:#161c2a;
  --card2:#1d2438;
  --border:rgba(255,255,255,0.08);
  --border2:rgba(255,255,255,0.12);
  --text:#f0f2f8;
  --text2:#8b93ae;
  --text3:#555f7a;
  --accent:#4f7cff;
  --accent2:#7c5cfc;
  --accent-glow:rgba(79,124,255,0.25);
  --green:#22c55e;
  --green-bg:rgba(34,197,94,0.12);
  --red:#ef4444;
  --red-bg:rgba(239,68,68,0.12);
  --yellow:#f59e0b;
  --yellow-bg:rgba(245,158,11,0.12);
  --purple:#a855f7;
  --purple-bg:rgba(168,85,247,0.12);
  --teal:#14b8a6;
  --teal-bg:rgba(20,184,166,0.12);
  --r:10px;--r2:14px;--r3:20px;
  --bottom-nav:64px;
  --font:'Syne',sans-serif;
  --font-body:'DM Sans',sans-serif;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
html,body,#root{height:100%;font-family:var(--font-body);background:var(--bg);color:var(--text);overflow:hidden}
::-webkit-scrollbar{width:0;height:0}
input,select,textarea,button{font-family:var(--font-body);-webkit-appearance:none}
input::placeholder,textarea::placeholder{color:var(--text3)}

/* Animations */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideInRight{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}
@keyframes slideInUp{from{opacity:0;transform:translateY(100%)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
@keyframes glow{0%,100%{box-shadow:0 0 20px var(--accent-glow)}50%{box-shadow:0 0 40px var(--accent-glow),0 0 80px var(--accent-glow)}}
@keyframes bounceIn{0%{transform:scale(0.85);opacity:0}70%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}

.fade-in{animation:fadeIn 0.2s ease forwards}
.slide-up{animation:slideUp 0.3s cubic-bezier(0.34,1.2,0.64,1) forwards}
.slide-in-right{animation:slideInRight 0.35s cubic-bezier(0.4,0,0.2,1) forwards}
.slide-in-up{animation:slideInUp 0.4s cubic-bezier(0.4,0,0.2,1) forwards}
.bounce-in{animation:bounceIn 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards}
.spin{animation:spin 0.8s linear infinite;display:inline-block}
.skeleton{background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);background-size:400px 100%;animation:shimmer 1.5s infinite;border-radius:8px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 18px;height:44px;border-radius:var(--r3);border:none;cursor:pointer;font-family:var(--font);font-size:14px;font-weight:600;transition:all 0.18s;white-space:nowrap;outline:none;letter-spacing:0.02em;position:relative;overflow:hidden}
.btn:active{transform:scale(0.96)}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 20px var(--accent-glow)}
.btn-primary:hover{box-shadow:0 6px 28px var(--accent-glow);filter:brightness(1.1)}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.btn-ghost{background:var(--card2);color:var(--text);border:1px solid var(--border2)}
.btn-ghost:hover{background:var(--card2);border-color:var(--accent)}
.btn-danger{background:var(--red-bg);color:var(--red);border:1px solid rgba(239,68,68,0.2)}
.btn-sm{height:36px;padding:0 14px;font-size:13px}
.btn-icon{width:44px;height:44px;padding:0;border-radius:50%;background:var(--card2);color:var(--text2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.btn-icon:active{transform:scale(0.92)}

/* Inputs */
.input{width:100%;padding:0 16px;height:48px;background:var(--card);border:1.5px solid var(--border);border-radius:var(--r2);color:var(--text);font-size:15px;outline:none;transition:all 0.2s;font-family:var(--font-body)}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
textarea.input{height:auto;padding:14px 16px;resize:none;line-height:1.6}
select.input{cursor:pointer}
select.input option{background:var(--card);color:var(--text)}

/* Status pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:0.04em;font-family:var(--font)}
.pill-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}

/* Bottom Nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--bottom-nav) + var(--safe-bottom));background:var(--bg2);border-top:1px solid var(--border);display:flex;align-items:flex-start;padding-top:8px;z-index:1000}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--text3);cursor:pointer;padding:4px 0;transition:all 0.2s;font-family:var(--font-body)}
.nav-btn.active{color:var(--accent)}
.nav-btn-icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:10px;transition:all 0.2s;font-size:18px}
.nav-btn.active .nav-btn-icon{background:var(--accent-glow)}
.nav-btn span:last-child{font-size:10px;font-weight:600;letter-spacing:0.04em}

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);transition:all 0.2s}
.card-active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow)}

/* Map styles */
.gm-style-iw{border-radius:var(--r2)!important;background:var(--card)!important;padding:0!important;box-shadow:0 8px 32px rgba(0,0,0,0.5)!important}
.gm-style-iw-d{padding:0!important;overflow:hidden!important;background:var(--card)!important}
.gm-style-iw-tc::after{background:var(--card)!important}
.gm-ui-hover-effect{top:4px!important;right:4px!important;filter:invert(1)!important}

/* Autocomplete */
.pac-container{background:var(--card2)!important;border:1px solid var(--border2)!important;border-radius:var(--r2)!important;box-shadow:0 8px 32px rgba(0,0,0,0.5)!important;margin-top:4px!important;padding:6px!important;font-family:var(--font-body)!important}
.pac-item{padding:10px 14px!important;font-size:14px!important;border:none!important;cursor:pointer!important;color:var(--text)!important;border-radius:8px!important;font-family:var(--font-body)!important;background:transparent!important}
.pac-item:hover{background:var(--card)!important}
.pac-item-query{color:var(--text)!important;font-weight:500!important}
.pac-icon{filter:invert(1)!important;opacity:0.5!important;margin-right:10px!important}
.pac-matched{color:var(--accent)!important;font-weight:700!important}

/* Progress */
.progress-bar{height:3px;background:var(--border);border-radius:0;overflow:hidden;position:absolute;top:0;left:0;right:0}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width 0.4s ease;border-radius:0}

/* Stagger */
.stagger>*{opacity:0;animation:slideUp 0.3s cubic-bezier(0.34,1.2,0.64,1) forwards}
.stagger>*:nth-child(1){animation-delay:.03s}.stagger>*:nth-child(2){animation-delay:.06s}
.stagger>*:nth-child(3){animation-delay:.09s}.stagger>*:nth-child(4){animation-delay:.12s}
.stagger>*:nth-child(5){animation-delay:.15s}.stagger>*:nth-child(6){animation-delay:.18s}
.stagger>*:nth-child(7){animation-delay:.21s}.stagger>*:nth-child(8){animation-delay:.24s}
.stagger>*:nth-child(n+9){animation-delay:.27s}

/* Scroll */
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}

/* Stars */
.stars{color:var(--yellow);font-size:11px;letter-spacing:1px}

/* Range */
input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:2px;background:linear-gradient(to right,var(--accent) 0%,var(--accent) var(--val,50%),var(--border2) var(--val,50%));outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 2px 8px var(--accent-glow);cursor:pointer;border:2px solid var(--bg)}

.toast-item{padding:14px 18px;border-radius:var(--r2);background:var(--card2);color:var(--text);font-size:14px;font-family:var(--font-body);border:1px solid var(--border2);box-shadow:0 8px 32px rgba(0,0,0,0.4);display:flex;align-items:center;gap:10px;animation:slideUp 0.3s cubic-bezier(0.34,1.2,0.64,1);width:100%}

/* Cat grid */
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px 10px;border-radius:var(--r);cursor:pointer;transition:all 0.18s;border:1.5px solid var(--border);background:var(--card);min-height:68px;justify-content:center}
.cat-item:active{transform:scale(0.94)}
.cat-item.active{border-color:var(--accent);background:rgba(79,124,255,0.1)}
.cat-item span:first-child{font-size:20px;line-height:1}
.cat-item span:last-child{font-size:9px;font-weight:600;text-align:center;color:var(--text2);line-height:1.2;letter-spacing:0.04em;text-transform:uppercase}
.cat-item.active span:last-child{color:var(--accent)}

/* Badge */
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;font-family:var(--font)}

/* Map overlay sheet */
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:500;backdrop-filter:blur(4px)}
.sheet{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-radius:20px 20px 0 0;z-index:501;max-height:90vh;display:flex;flex-direction:column;border-top:1px solid var(--border2)}
.sheet-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:12px auto 8px;flex-shrink:0}

/* Page */
.page{position:absolute;inset:0;bottom:var(--bottom-nav);display:flex;flex-direction:column;overflow:hidden}

/* Score badge */
.score-badge{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-direction:column;flex-shrink:0}

/* Switch */
.switch{position:relative;width:44px;height:24px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch-slider{position:absolute;inset:0;background:var(--card2);border:1.5px solid var(--border2);border-radius:12px;cursor:pointer;transition:0.3s}
.switch-slider::before{content:"";position:absolute;width:16px;height:16px;left:3px;bottom:3px;background:var(--text3);border-radius:50%;transition:0.3s}
input:checked+.switch-slider{background:var(--accent);border-color:var(--accent)}
input:checked+.switch-slider::before{transform:translateX(20px);background:#fff}

/* Empty */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:48px 24px;text-align:center;flex:1}
</style>

// ── Helpers ───────────────────────────────────────────────────────────────
function scoreLeadData(lead) {
  let s = 0;
  if (lead.rating >= 4.5) s += 30; else if (lead.rating >= 4.0) s += 20; else if (lead.rating >= 3.5) s += 10;
  if (lead.user_ratings_total >= 100) s += 25; else if (lead.user_ratings_total >= 50) s += 15; else if (lead.user_ratings_total >= 20) s += 8;
  if (lead.website) s += 15;
  if (lead.phone || lead.international_phone_number) s += 10;
  if (lead.price_level > 0) s += 5;
  return Math.min(s, 99);
}
function scoreColor(s){ return s>=70?"#22c55e":s>=45?"#f59e0b":"#ef4444"; }
function scoreBg(s)   { return s>=70?"rgba(34,197,94,0.12)":s>=45?"rgba(245,158,11,0.12)":"rgba(239,68,68,0.12)"; }
function getPos(loc) {
  if (!loc) return null;
  return { lat: typeof loc.lat==="function"?loc.lat():loc.lat, lng: typeof loc.lng==="function"?loc.lng():loc.lng };
}
function fmt(n) { if(!n)return""; return n>=1000?(n/1000).toFixed(1)+"k":n.toString(); }

// ── Toast ─────────────────────────────────────────────────────────────────
let _toast = null;
function Toaster() {
  const [list, setList] = useState([]);
  useEffect(() => {
    _toast = (msg, type="info", dur=3000) => {
      const id = Date.now();
      const icons = {info:"💡",success:"✅",error:"❌",warning:"⚠️"};
      setList(t => [...t.slice(-2), {id, msg, type, icon: icons[type]}]);
      setTimeout(() => setList(t => t.filter(x => x.id !== id)), dur);
    };
  }, []);
  return (
    <div className="toast-wrap">
      {list.map(t => (
        <div key={t.id} className="toast-item">
          <span>{t.icon}</span><span style={{flex:1}}>{t.msg}</span>
        </div>
      ))}
    </div>
  );
}
const toast = (m, t, d) => _toast?.(m, t, d);

// ── Firebase hook ─────────────────────────────────────────────────────────
function useFirebase() {
  const [ready, setReady] = useState(!!window.__fb);
  useEffect(() => {
    if (window.__fb) { setReady(true); return; }
    const h = () => setReady(true);
    window.addEventListener("fb-ready", h);
    return () => window.removeEventListener("fb-ready", h);
  }, []);
  return ready ? window.__fb : null;
}

function useLeads(fb) {
  const [leads, setLeads] = useState([]);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    if (!fb) return;
    return fb.subscribeLeads(data => { setLeads(data); setLoading(false); });
  }, [fb]);
  const saveLeads = useCallback(async (arr) => {
    if (!fb) return;
    await Promise.all(arr.map(l => fb.addLead({...l, score: scoreLeadData(l)})));
  }, [fb]);
  const updateLead = useCallback(async (id, upd) => fb?.updateLead(id, upd), [fb]);
  const deleteLead = useCallback(async (id) => fb?.deleteLead(id), [fb]);
  return { leads, loading, saveLeads, updateLead, deleteLead };
}

function useMaps() {
  const [ready, setReady] = useState(window.__mapsReady||false);
  const [error, setError] = useState(null);
  useEffect(() => {
    if (window.__mapsReady) { setReady(true); return; }
    const onReady = () => setReady(true);
    window.addEventListener("maps-ready", onReady);
    window.__loadMaps().catch(e => setError(e?.message||"Maps failed"));
    return () => window.removeEventListener("maps-ready", onReady);
  }, []);
  return { ready, error };
}

// ── Stars ─────────────────────────────────────────────────────────────────
function Stars({ rating }) {
  if (!rating) return null;
  const full = Math.floor(rating);
  const half = rating - full >= 0.5;
  return (
    <span style={{display:"inline-flex",alignItems:"center",gap:3}}>
      <span className="stars">{"★".repeat(full)}{half?"½":""}</span>
      <span style={{fontSize:12,color:"#8b93ae"}}>{rating.toFixed(1)}</span>
    </span>
  );
}

// ── Map Component ─────────────────────────────────────────────────────────
function MapPane({ center, radius, leads, onSelect, selected }) {
  const ref = useRef(); const mapRef = useRef(); const circleRef = useRef();
  const markers = useRef([]); const iwRef = useRef();

  useEffect(() => {
    if (!ref.current || !window.google) return;
    mapRef.current = new window.google.maps.Map(ref.current, {
      center, zoom: 13,
      mapTypeControl:false, streetViewControl:false, fullscreenControl:false,
      zoomControl:false, gestureHandling:"greedy",
      styles: MAP_STYLES, clickableIcons:false,
    });
    iwRef.current = new window.google.maps.InfoWindow({ maxWidth:280, disableAutoPan:false });
  }, []);

  useEffect(() => {
    if (!mapRef.current||!window.google) return;
    mapRef.current.panTo(center);
    if (circleRef.current) circleRef.current.setMap(null);
    circleRef.current = new window.google.maps.Circle({
      map:mapRef.current, center, radius:radius*1000,
      fillColor:"#4f7cff", fillOpacity:0.07,
      strokeColor:"#4f7cff", strokeOpacity:0.5, strokeWeight:1.5, clickable:false,
    });
  }, [center, radius]);

  useEffect(() => {
    if (!mapRef.current||!window.google) return;
    markers.current.forEach(m=>m.setMap(null)); markers.current=[];
    leads.forEach(lead => {
      const pos = getPos(lead.geometry?.location); if (!pos) return;
      const isSel = selected?.place_id === lead.place_id;
      const sc = lead.score||scoreLeadData(lead);
      const cfg = STATUS_CONFIG[lead.status||"new"];
      const svgMarker = {
        path:"M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z",
        fillColor: isSel?"#4f7cff":cfg.dot, fillOpacity:1,
        strokeColor:"#0a0d14", strokeWeight: isSel?2:1.5,
        scale: isSel?2.2:1.8, anchor:new window.google.maps.Point(12,22),
      };
      const m = new window.google.maps.Marker({
        map:mapRef.current, position:pos, title:lead.name, icon:svgMarker,
        zIndex: isSel?1000:sc,
        animation: isSel?window.google.maps.Animation.DROP:null,
      });
      m.addListener("click", () => {
        onSelect(lead);
        iwRef.current.setContent(`
          <div style="font-family:'DM Sans',sans-serif;padding:14px;background:#161c2a;min-width:200px;color:#f0f2f8">
            <p style="margin:0 0 3px;font-weight:700;font-size:14px;color:#f0f2f8">${lead.name}</p>
            <p style="margin:0 0 8px;font-size:12px;color:#8b93ae">${lead.vicinity||""}</p>
            <div style="display:flex;align-items:center;gap:8px">
              ${lead.rating?`<span style="font-size:12px;color:#f59e0b;font-weight:700">★ ${lead.rating}</span>`:""}
              ${lead.user_ratings_total?`<span style="font-size:11px;color:#555f7a">${fmt(lead.user_ratings_total)} reviews</span>`:""}
              <span style="font-size:11px;font-weight:700;color:${scoreColor(sc)};background:${scoreBg(sc)};padding:2px 8px;border-radius:10px">${sc}pts</span>
            </div>
          </div>
        `);
        iwRef.current.open({ map:mapRef.current, anchor:m });
      });
      markers.current.push(m);
    });
  }, [leads, onSelect, selected]);

  return <div ref={ref} style={{width:"100%",height:"100%"}} />;
}

// ── Location Input ────────────────────────────────────────────────────────
function LocationInput({ onPlace, value, onChange }) {
  const inputRef = useRef(); const { ready } = useMaps();

    if (!ready||!window.google||!inputRef.current) return;

      const ac = new window.google.maps.places.Autocomplete(inputRef.current, {
        types:["geocode","establishment"], fields:["geometry","formatted_address","name"],
      });

        const p = ac.getPlace();
        if (p.geometry?.location) onPlace(
          {lat:p.geometry.location.lat(),lng:p.geometry.location.lng()},
          p.formatted_address||p.name||""
        );
      });
    }
  }, [ready]);
  return (
    <input ref={inputRef} className="input" value={value} onChange={e=>onChange(e.target.value)}
      placeholder="Search city, area or place…" style={{fontSize:15}}/>
  );
}

            <p style={{fontSize:11,color:"var(--text3)",marginBottom:8,fontWeight:600,letterSpacing:"0.05em",textTransform:"uppercase"}}>Quick tags</p>
            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
              {["hot lead","follow up","no website","high reviews","needs call","send proposal","local biz","franchise"].map(qt=>(
                <button key={qt} onClick={()=>setNewTag(qt)}
                  style={{padding:"6px 12px",borderRadius:20,border:"1px solid var(--border2)",background:"var(--card)",color:"var(--text2)",fontSize:12,cursor:"pointer",fontFamily:"var(--font-body)",fontWeight:500}}>
                  {qt}
                </button>
              ))}
            </div>
          </>}
        </div>
      </div>
    </>
  );
}

// ── Search Page ───────────────────────────────────────────────────────────
function SearchPage({ onResults, onCenterChange, fb, onSelectLead, leads: savedLeads, updateLead, deleteLead }) {
  const [locText, setLocText]     = useState("");
  const [coords, setCoords]       = useState(null);
  const [radius, setRadius]       = useState(2);
  const [type, setType]           = useState("restaurant");
  const [keyword, setKeyword]     = useState("");
  const [minRating, setMinRating] = useState(0);
  const [searching, setSearching] = useState(false);
  const [progress, setProgress]   = useState(0);
  const [results, setResults]     = useState([]);
  const [saving, setSaving]       = useState(false);
  const [selected, setSelected]   = useState(null);
  const [showDetail, setShowDetail] = useState(false);
  const [showFilters, setShowFilters] = useState(false);
  const [catSearch, setCatSearch] = useState("");
  const { ready: mapsReady, error: mapsError } = useMaps();
  const rangeRef = useRef();

  useEffect(() => {
    if (rangeRef.current) {
      const pct = ((radius-0.5)/(50-0.5))*100;
      rangeRef.current.style.setProperty("--val", pct+"%");
    }
  }, [radius]);

  const handlePlace = useCallback((c, address) => {
    setCoords(c); setLocText(address||""); onCenterChange(c);
  }, [onCenterChange]);

  const useMyLocation = () => {
    if (!navigator.geolocation) { toast("Geolocation not supported","error"); return; }
    navigator.geolocation.getCurrentPosition(pos => {
      const c = {lat:pos.coords.latitude,lng:pos.coords.longitude};
      setCoords(c); onCenterChange(c); setLocText("📍 My Location");
      toast("Location detected!","success");
    }, () => toast("Location access denied","error"));
  };

  const doSearch = async () => {
    if (!coords)    { toast("Please select a location first","warning"); return; }
    if (!mapsReady) { toast(mapsError||"Maps API not ready","error"); return; }
    setSearching(true); setProgress(15); setResults([]);
    try {
      const ll  = new window.google.maps.LatLng(coords.lat, coords.lng);
      const svc = new window.google.maps.places.PlacesService(document.createElement("div"));
      const req = {location:ll, radius:radius*1000, type};
      if (keyword.trim()) req.keyword = keyword.trim();
      setProgress(40);
      const { results: r1, pagination } = await new Promise((res,rej) =>
        svc.nearbySearch(req, (r,s,p) => s==="OK"||s==="ZERO_RESULTS" ? res({results:r||[],pagination:p}) : rej(new Error(s)))
      );
      setProgress(70);
      let all = [...r1];
      if (pagination?.hasNextPage) {
        const more = await new Promise(res =>
          setTimeout(()=>pagination.nextPage((r,s)=>res(s==="OK"?r:[])), 2000)
        );
        all = [...all,...more];
      }
      setProgress(90);
      if (minRating>0) all = all.filter(r=>(r.rating||0)>=minRating);
      const enriched = all.map(r=>({...r,score:scoreLeadData(r)}));
      enriched.sort((a,b)=>(b.score||0)-(a.score||0));
      setProgress(100);
      setResults(enriched);
      onResults(enriched, coords, radius);
      fb?.addSearchHistory({location:locText,coords,radius,type,keyword,minRating,resultCount:enriched.length}).catch(()=>{});
      toast(`Found ${enriched.length} businesses!`,"success");
    } catch(e) {
      toast("Search failed: "+e.message,"error");
    } finally {
      setSearching(false); setTimeout(()=>setProgress(0),600);
    }
  };

  const saveAll = async () => {
    if (!results.length||!fb) return;
    setSaving(true);
    try {
      await Promise.all(results.map(r => fb.addLead({
        name:r.name, vicinity:r.vicinity||"", rating:r.rating||null,
        user_ratings_total:r.user_ratings_total||null, place_id:r.place_id,
        types:r.types||[], website:r.website||"",
        phone:r.international_phone_number||"", score:scoreLeadData(r),
        geometry:{location:getPos(r.geometry?.location)}
      })));
      toast(`${results.length} leads saved!`,"success");
      setResults([]);
    } catch(e) { toast("Save failed","error"); }
    finally { setSaving(false); }
  };

  const filteredCats = catSearch ? CATEGORIES.filter(c=>c.label.toLowerCase().includes(catSearch.toLowerCase())||c.value.includes(catSearch.toLowerCase())) : CATEGORIES;
  const selCat = CATEGORIES.find(c=>c.value===type);

  return (
    <div style={{display:"flex",flexDirection:"column",height:"100%",position:"relative"}}>
      {/* Progress */}
      {progress>0 && (
        <div className="progress-bar">
          <div className="progress-fill" style={{width:`${progress}%`}}/>
        </div>
      )}

      {/* Header */}
      <div style={{padding:"16px 16px 12px",flexShrink:0,background:"var(--bg2)",borderBottom:"1px solid var(--border)"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
          <div>
            <p style={{fontFamily:"var(--font)",fontWeight:800,fontSize:20,lineHeight:1,letterSpacing:"-0.02em"}}>
              <span style={{color:"var(--text)"}}>Lead</span><span style={{color:"var(--accent)"}}>Hunter</span><span style={{color:"var(--accent2)",fontSize:13,marginLeft:4,fontWeight:600}}>Pro</span>
            </p>
            <p style={{fontSize:11,color:"var(--text3)",marginTop:2,fontWeight:500,letterSpacing:"0.05em",textTransform:"uppercase"}}>Smart Lead Finder</p>
          </div>
          <button className="btn-icon" onClick={()=>setShowFilters(true)} style={{position:"relative"}}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
            {(minRating>0||keyword) && <span style={{position:"absolute",top:8,right:8,width:8,height:8,background:"var(--accent)",borderRadius:"50%",border:"2px solid var(--bg2)"}}/>}
          </button>
        </div>

        <div style={{display:"flex",gap:8,marginBottom:12}}>
          <div style={{flex:1}}>
            <LocationInput onPlace={handlePlace} value={locText} onChange={setLocText}/>
          </div>
          <button className="btn-icon" onClick={useMyLocation} title="Use my location" style={{flexShrink:0}}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
          </button>
        </div>

        {/* Selected type chip */}
        <button onClick={()=>setShowFilters(true)} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 14px",background:"var(--card)",border:"1.5px solid var(--accent)",borderRadius:20,cursor:"pointer",width:"100%",textAlign:"left",transition:"all 0.15s"}}>
          <span style={{fontSize:18}}>{selCat?.icon||"🔍"}</span>
          <span style={{fontFamily:"var(--font)",fontWeight:600,fontSize:13,color:"var(--accent)",flex:1}}>{selCat?.label||"Select type"}</span>
          <span style={{fontSize:12,color:"var(--accent)",fontFamily:"var(--font)",fontWeight:600}}>{radius}km ›</span>
        </button>
      </div>

      {/* Results */}
      <div className="scroll" style={{flex:1,padding:"12px 12px 8px"}}>
        {results.length===0 ? (
          <div className="empty-state">
            <div style={{fontSize:64,lineHeight:1}}>🎯</div>
            <div>
              <p style={{fontFamily:"var(--font)",fontWeight:700,fontSize:17,color:"var(--text2)",marginBottom:6}}>Ready to Hunt</p>
              <p style={{fontSize:13,color:"var(--text3)",lineHeight:1.7,maxWidth:260}}>Set your location, choose a business type, and tap Hunt Leads to find prospects.</p>
            </div>
            {mapsError && <p style={{fontSize:12,color:"var(--red)",background:"var(--red-bg)",padding:"10px 16px",borderRadius:"var(--r)",fontWeight:500}}>⚠ Maps: {mapsError}</p>}
          </div>
        ) : (
          <div style={{marginBottom:8}}>
            <div className="bounce-in" style={{background:"rgba(79,124,255,0.08)",borderRadius:"var(--r2)",padding:"12px 16px",textAlign:"center",marginBottom:12,border:"1px solid rgba(79,124,255,0.2)"}}>
              <p style={{fontFamily:"var(--font)",fontSize:32,fontWeight:800,color:"var(--accent)",lineHeight:1}}>{results.length}</p>
              <p style={{fontSize:12,color:"var(--text2)",marginTop:2,fontWeight:500}}>businesses found & scored</p>
            </div>
            <button onClick={saveAll} disabled={saving||!fb} className="btn btn-primary" style={{width:"100%",height:48,fontSize:15,marginBottom:12}}>
              {saving ? <><div style={{width:18,height:18,border:"2.5px solid rgba(255,255,255,0.3)",borderTop:"2.5px solid #fff",borderRadius:"50%"}} className="spin"/>Saving…</> : "💾 Save All to Pipeline"}
            </button>
            <div className="stagger">
              {results.map(lead=>(
                <LeadCard key={lead.place_id} lead={lead} selected={selected?.place_id===lead.place_id}
                  onClick={()=>{setSelected(lead);setShowDetail(true);}}
                  onStatus={()=>{}}/>
              ))}
            </div>
          </div>
        )}
      </div>

      {/* Hunt button */}
      <div style={{padding:"12px 16px",flexShrink:0,background:"var(--bg2)",borderTop:"1px solid var(--border)"}}>
        <button onClick={doSearch} disabled={searching} className="btn btn-primary" style={{width:"100%",height:52,fontSize:16,fontFamily:"var(--font)",fontWeight:800,letterSpacing:"0.02em"}}>
          {searching
            ? <><div style={{width:20,height:20,border:"2.5px solid rgba(255,255,255,0.3)",borderTop:"2.5px solid #fff",borderRadius:"50%"}} className="spin"/>Hunting…</>
            : "🎯 Hunt Leads"
          }
        </button>
      </div>

      {/* Filters Sheet */}
      {showFilters && <>
        <div className="sheet-overlay" onClick={()=>setShowFilters(false)}/>
        <div className="sheet slide-in-up" style={{maxHeight:"92vh"}}>
          <div className="sheet-handle"/>
          <div style={{padding:"4px 16px 12px",flexShrink:0,display:"flex",justifyContent:"space-between",alignItems:"center",borderBottom:"1px solid var(--border)"}}>
            <p style={{fontFamily:"var(--font)",fontWeight:800,fontSize:18,color:"var(--text)"}}>Filters & Categories</p>
            <button className="btn-icon" onClick={()=>setShowFilters(false)} style={{width:36,height:36}}>✕</button>
          </div>
          <div className="scroll" style={{flex:1,padding:"16px",overflowY:"auto"}}>
            {/* Radius */}
            <div style={{marginBottom:20}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:12}}>
                <label style={{fontSize:13,fontWeight:700,color:"var(--text)",fontFamily:"var(--font)"}}>Search Radius</label>
                <span style={{fontSize:14,fontWeight:800,color:"var(--accent)",fontFamily:"var(--font)"}}>{radius} km</span>
              </div>
              <input ref={rangeRef} type="range" min="0.5" max="50" step="0.5" value={radius}
                onChange={e=>{setRadius(+e.target.value);const pct=((+e.target.value-0.5)/(50-0.5))*100;e.target.style.setProperty("--val",pct+"%");}}/>
              <div style={{display:"flex",justifyContent:"space-between",marginTop:6}}>
                <span style={{fontSize:11,color:"var(--text3)"}}>0.5 km</span>
                <span style={{fontSize:11,color:"var(--text3)"}}>50 km</span>
              </div>
            </div>

            {/* Min rating */}
            <div style={{marginBottom:20}}>
              <label style={{fontSize:13,fontWeight:700,color:"var(--text)",fontFamily:"var(--font)",display:"block",marginBottom:10}}>Minimum Rating</label>
              <div style={{display:"flex",gap:6}}>
                {[0,3,3.5,4,4.5].map(v=>(
                  <button key={v} onClick={()=>setMinRating(v)}
                    style={{flex:1,height:40,borderRadius:20,border:`1.5px solid ${minRating===v?"var(--yellow)":"var(--border2)"}`,background:minRating===v?"var(--yellow-bg)":"var(--card)",color:minRating===v?"var(--yellow)":"var(--text2)",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"var(--font)",transition:"all 0.15s"}}>
                    {v===0?"Any":`${v}★`}
                  </button>
                ))}
              </div>
            </div>

            {/* Keyword */}
            <div style={{marginBottom:20}}>
              <label style={{fontSize:13,fontWeight:700,color:"var(--text)",fontFamily:"var(--font)",display:"block",marginBottom:10}}>Keyword (optional)</label>
              <input className="input" value={keyword} onChange={e=>setKeyword(e.target.value)} placeholder="e.g. Italian, luxury, 24hr…" style={{height:48}}/>
            </div>

            {/* Categories */}
            <div>
              <label style={{fontSize:13,fontWeight:700,color:"var(--text)",fontFamily:"var(--font)",display:"block",marginBottom:10}}>
                Business Type <span style={{color:"var(--text3)",fontSize:11,fontWeight:500}}>({CATEGORIES.length} categories)</span>
              </label>
              <input className="input" value={catSearch} onChange={e=>setCatSearch(e.target.value)} placeholder="Search categories…" style={{height:44,marginBottom:12,fontSize:14}}/>
              <div className="cat-grid">
                {filteredCats.map(cat=>(
                  <div key={cat.value} className={`cat-item${type===cat.value?" active":""}`}
                    onClick={()=>{setType(cat.value);setTimeout(()=>setShowFilters(false),200);}}>
                    <span>{cat.icon}</span>
                    <span>{cat.label}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
          <div style={{padding:"12px 16px",flexShrink:0,borderTop:"1px solid var(--border)"}}>
            <button onClick={()=>setShowFilters(false)} className="btn btn-primary" style={{width:"100%",height:48,fontSize:15,fontFamily:"var(--font)",fontWeight:700}}>
              Apply Filters ✓
            </button>
          </div>
        </div>
      </>}

      {/* Detail Sheet */}
      {showDetail && selected && (
        <DetailSheet lead={selected} onClose={()=>setShowDetail(false)}
          onUpdate={updateLead} onDelete={deleteLead} fb={fb}/>
      )}
    </div>
  );
}

// ── Map Page ──────────────────────────────────────────────────────────────
function MapPage({ center, radius, leads, searchResults }) {
  const { ready, error } = useMaps();
  const [selected, setSelected] = useState(null);
  const allLeads = useMemo(()=>[...searchResults,...leads.filter(l=>!searchResults.find(r=>r.place_id===l.place_id))],[leads,searchResults]);

  if (!ready) return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100%",gap:16}}>
      {error
        ? <><div style={{fontSize:48}}>🗺️</div><p style={{color:"var(--red)",fontWeight:600,textAlign:"center",padding:"0 24px"}}>{error}</p></>
        : <><div style={{width:40,height:40,border:"3px solid var(--accent)",borderTop:"3px solid transparent",borderRadius:"50%"}} className="spin"/><p style={{color:"var(--text2)",fontWeight:500}}>Loading Maps…</p></>
      }
    </div>
  );

  return (
    <div style={{position:"relative",width:"100%",height:"100%"}}>
      <MapPane center={center} radius={radius} leads={allLeads} onSelect={setSelected} selected={selected}/>
      <div style={{position:"absolute",top:12,left:12,right:12,zIndex:100}}>
        <div style={{background:"rgba(10,13,20,0.85)",backdropFilter:"blur(12px)",borderRadius:"var(--r2)",padding:"10px 14px",border:"1px solid var(--border)"}}>
          <p style={{fontSize:12,fontWeight:600,color:"var(--text2)",fontFamily:"var(--font)",letterSpacing:"0.05em",textTransform:"uppercase"}}>
            {allLeads.length} lead{allLeads.length!==1?"s":""} on map
          </p>
        </div>
      </div>
      {selected && (
        <DetailSheet lead={selected} onClose={()=>setSelected(null)} onUpdate={()=>{}} onDelete={()=>{}} fb={null}/>
      )}
    </div>
  );
}

// ── Pipeline Page ─────────────────────────────────────────────────────────
function PipelinePage({ leads, loading, updateLead, deleteLead, fb }) {
  const [filterStatus, setFilterStatus] = useState("all");
  const [filterText, setFilterText]     = useState("");
  const [sort, setSort]                 = useState("score");
  const [selected, setSelected]         = useState(null);
  const [showDetail, setShowDetail]     = useState(false);

  const stats = useMemo(()=>{
    const c = {total:leads.length}; Object.keys(STATUS_CONFIG).forEach(s=>c[s]=0);
    let tot=0; leads.forEach(l=>{c[l.status||"new"]=(c[l.status||"new"]||0)+1;tot+=(l.score||0);});
    c.avgScore = leads.length?Math.round(tot/leads.length):0; return c;
  },[leads]);

  const filtered = useMemo(()=>{
    let list=[...leads];
    if (filterStatus!=="all") list=list.filter(l=>(l.status||"new")===filterStatus);
    if (filterText) { const q=filterText.toLowerCase(); list=list.filter(l=>l.name?.toLowerCase().includes(q)||l.vicinity?.toLowerCase().includes(q)||(l.tags||[]).some(t=>t.includes(q))); }
    if (sort==="score") list.sort((a,b)=>(b.score||0)-(a.score||0));
    else if (sort==="rating") list.sort((a,b)=>(b.rating||0)-(a.rating||0));
    else if (sort==="reviews") list.sort((a,b)=>(b.user_ratings_total||0)-(a.user_ratings_total||0));
    else if (sort==="name") list.sort((a,b)=>a.name.localeCompare(b.name));
    return list;
  },[leads,filterStatus,filterText,sort]);

  const exportCSV = () => {
    if (!leads.length) { toast("Nothing to export","warning"); return; }
    const rows=[["Name","Address","Rating","Reviews","Score","Status","Phone","Website","Tags"]];
    leads.forEach(l=>rows.push([l.name,l.vicinity||"",l.rating||"",l.user_ratings_total||"",l.score||"",l.status||"new",l.phone||"",l.website||"",(l.tags||[]).join("; ")]));
    const csv=rows.map(r=>r.map(c=>`"${String(c||"").replace(/"/g,'""')}"`).join(",")).join("\n");
    const a=document.createElement("a"); a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv); a.download=`leads-${Date.now()}.csv`; a.click();
    toast("CSV exported!","success");
  };

  return (
    <div style={{display:"flex",flexDirection:"column",height:"100%"}}>
      {/* Header */}
      <div style={{padding:"16px 16px 12px",flexShrink:0,background:"var(--bg2)",borderBottom:"1px solid var(--border)"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
          <p style={{fontFamily:"var(--font)",fontWeight:800,fontSize:18,color:"var(--text)"}}>Pipeline</p>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            <button onClick={exportCSV} className="btn-icon" style={{width:38,height:38}}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
            </button>
          </div>
        </div>

        {/* Stats row */}
        <div style={{display:"flex",gap:8,marginBottom:12,overflowX:"auto",paddingBottom:2}}>
          {[{label:"Total",val:stats.total,color:"var(--accent)"},{label:"Avg Score",val:stats.avgScore,color:"var(--text)"}].map(s=>(
            <div key={s.label} style={{background:"var(--card)",borderRadius:"var(--r)",padding:"10px 14px",flexShrink:0,textAlign:"center",minWidth:72}}>
              <p style={{fontFamily:"var(--font)",fontSize:20,fontWeight:800,color:s.color,lineHeight:1}}>{s.val}</p>
              <p style={{fontSize:10,color:"var(--text3)",marginTop:3,fontWeight:600,letterSpacing:"0.05em",textTransform:"uppercase"}}>{s.label}</p>
            </div>
          ))}
          {Object.entries(STATUS_CONFIG).map(([s,cfg])=>stats[s]>0&&(
            <div key={s} className="pill" style={{background:cfg.bg,color:cfg.color,flexShrink:0,padding:"8px 12px",fontSize:12,borderRadius:"var(--r)"}}>
              <span className="pill-dot" style={{background:cfg.dot}}/><span style={{fontWeight:800}}>{stats[s]}</span><span style={{fontWeight:500,marginLeft:3}}>{cfg.label}</span>
            </div>
          ))}
        </div>

        {/* Filters */}
        <div style={{display:"flex",gap:8}}>
          <input className="input" value={filterText} onChange={e=>setFilterText(e.target.value)} placeholder="🔍 Search leads…" style={{height:40,flex:1,fontSize:14}}/>
          <select className="input" value={filterStatus} onChange={e=>setFilterStatus(e.target.value)} style={{height:40,width:110,fontSize:13,padding:"0 10px"}}>
            <option value="all">All</option>
            {Object.entries(STATUS_CONFIG).map(([v,c])=><option key={v} value={v}>{c.label}</option>)}
          </select>
        </div>
        <select className="input" value={sort} onChange={e=>setSort(e.target.value)} style={{height:36,fontSize:12,padding:"0 10px",marginTop:6}}>
          <option value="score">Top Score</option>
          <option value="rating">Top Rating</option>
          <option value="reviews">Most Reviews</option>
          <option value="name">A–Z Name</option>
        </select>
      </div>

      {/* List */}
      <div className="scroll" style={{flex:1,padding:"8px 12px"}}>
        {loading ? (
          <div style={{display:"flex",flexDirection:"column",gap:8,marginTop:8}}>
            {[1,2,3,4,5].map(i=>(
              <div key={i} className="card" style={{padding:"14px",display:"flex",gap:12}}>
                <div className="skeleton" style={{width:44,height:44,borderRadius:12,flexShrink:0}}/>
                <div style={{flex:1}}>
                  <div className="skeleton" style={{height:13,width:"70%",marginBottom:8}}/>
                  <div className="skeleton" style={{height:11,width:"50%"}}/>
                </div>
              </div>
            ))}
          </div>
        ) : filtered.length===0 ? (
          <div className="empty-state">
            <div style={{fontSize:56}}>💼</div>
            <div>
              <p style={{fontFamily:"var(--font)",fontWeight:700,fontSize:16,color:"var(--text2)",marginBottom:6}}>{leads.length===0?"Pipeline is empty":"No matches"}</p>
              <p style={{fontSize:13,color:"var(--text3)",lineHeight:1.7}}>{leads.length===0?"Search for businesses and save them to build your pipeline.":"Try adjusting your filters."}</p>
            </div>
          </div>
        ) : (
          <div className="stagger">
            {filtered.map(lead=>(
              <LeadCard key={lead.id} lead={lead} selected={selected?.id===lead.id}
                onClick={()=>{setSelected(lead);setShowDetail(true);}}
                onStatus={(id,s)=>updateLead(id,{status:s})}/>
            ))}
          </div>
        )}
      </div>

      {showDetail && selected && (
        <DetailSheet lead={selected} onClose={()=>setShowDetail(false)} onUpdate={updateLead} onDelete={deleteLead} fb={fb}/>
      )}
    </div>
  );
}

// ── Main App ──────────────────────────────────────────────────────────────
function App() {
  const fb = useFirebase();
  const { leads, loading, saveLeads, updateLead, deleteLead } = useLeads(fb);
  const { ready: mapsReady } = useMaps();
  const [center, setCenter]       = useState({lat:19.076,lng:72.877});
  const [radius, setRadius]       = useState(2);
  const [searchResults, setSearchResults] = useState([]);
  const [tab, setTab]             = useState("search");

  useEffect(() => {
    window.__loadMaps().catch(()=>{});
  }, []);

  const handleResults = useCallback((r, c, rad) => {
    setSearchResults(r); setCenter(c); setRadius(rad);
  }, []);

  const navItems = [
    { id:"search", icon:"🎯", label:"Search" },
    { id:"map",    icon:"🗺️", label:"Map", badge:searchResults.length||null },
    { id:"leads",  icon:"💼", label:"Pipeline", badge:leads.length||null },
  ];

  return (
    <>
      <Toaster/>
      <div style={{height:"100vh",display:"flex",flexDirection:"column",overflow:"hidden",background:"var(--bg)"}}>
        {/* Pages */}
        <div style={{flex:1,position:"relative",overflow:"hidden"}}>
          <div style={{position:"absolute",inset:0,bottom:0,display:tab==="search"?"flex":"none",flexDirection:"column"}}>
            <SearchPage onResults={handleResults} onCenterChange={setCenter} fb={fb}
              leads={leads} updateLead={updateLead} deleteLead={deleteLead}/>
          </div>
          <div style={{position:"absolute",inset:0,bottom:0,display:tab==="map"?"flex":"none",flexDirection:"column"}}>
            <MapPage center={center} radius={radius} leads={leads} searchResults={searchResults}/>
          </div>
          <div style={{position:"absolute",inset:0,bottom:0,display:tab==="leads"?"flex":"none",flexDirection:"column"}}>
            <PipelinePage leads={leads} loading={loading} updateLead={updateLead} deleteLead={deleteLead} fb={fb}/>
          </div>
        </div>

        {/* Bottom Nav */}
        <div className="bottom-nav">
          {navItems.map(item=>(
            <button key={item.id} className={`nav-btn${tab===item.id?" active":""}`} onClick={()=>setTab(item.id)}>
              <div className="nav-btn-icon" style={{position:"relative"}}>
                <span>{item.icon}</span>
                {item.badge>0 && <span style={{position:"absolute",top:-4,right:-6,minWidth:16,height:16,background:tab===item.id?"var(--accent)":"var(--text3)",borderRadius:8,fontSize:9,fontWeight:800,color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",padding:"0 4px",fontFamily:"var(--font)",border:"2px solid var(--bg)"}}>{item.badge>99?"99+":item.badge}</span>}
              </div>
              <span>{item.label}</span>
            </button>
          ))}
        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
