import { getAnalytics, logEvent } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-analytics.js";
import {
  getFirestore, collection, doc, addDoc, updateDoc, deleteDoc,
  getDocs, getDoc, setDoc, query, where, orderBy, serverTimestamp,
  onSnapshot, limit
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  apiKey: "AIzaSyAlQsON2HFJM5mCRP18E_R_UGP_x3SXNI8",
  authDomain: "leahunter.firebaseapp.com",
  projectId: "leahunter",
  storageBucket: "leahunter.firebasestorage.app",
  messagingSenderId: "446558524955",
  appId: "1:446558524955:web:89356211f5b0286efe0abe",
  measurementId: "G-PV9X2BLHSL"
};

const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
const db = getFirestore(app);

window.__fb = {
  trackEvent: (name, params={}) => { try { logEvent(analytics,name,params); } catch(e){} },
  addLead: async (lead) => {
    const ref = await addDoc(collection(db,"leads"), { ...lead, status:"new", notes:"", tags:[], score:0, createdAt:serverTimestamp(), updatedAt:serverTimestamp() });
    return ref.id;
  },
  updateLead: async (id, updates) => { await updateDoc(doc(db,"leads",id), { ...updates, updatedAt:serverTimestamp() }); },
  deleteLead: async (id) => { await deleteDoc(doc(db,"leads",id)); },
  subscribeLeads: (cb) => onSnapshot(query(collection(db,"leads"), orderBy("createdAt","desc")), snap => cb(snap.docs.map(d=>({id:d.id,...d.data()})))),
  addSearchHistory: async (s) => { await addDoc(collection(db,"searches"), { ...s, createdAt:serverTimestamp() }); },
  getSearchHistory: async () => { const snap = await getDocs(query(collection(db,"searches"), orderBy("createdAt","desc"), limit(20))); return snap.docs.map(d=>({id:d.id,...d.data()})); },
  addNote: async (leadId, note) => { const ref = await addDoc(collection(db,"leads",leadId,"notes"), { content:note, createdAt:serverTimestamp() }); return ref.id; },
  getNotes: async (leadId) => { const snap = await getDocs(query(collection(db,"leads",leadId,"notes"), orderBy("createdAt","asc"))); return snap.docs.map(d=>({id:d.id,...d.data()})); },
  deleteNote: async (leadId, noteId) => { await deleteDoc(doc(db,"leads",leadId,"notes",noteId)); },
};
window.dispatchEvent(new Event("fb-ready"));
</script>

<style>

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  --bg: #070810;
  --bg2: #0c0d18;
  --bg3: #111224;
  --bg4: #161829;
  --surface: rgba(255,255,255,0.035);

  --surface3: rgba(255,255,255,0.09);
  --border: rgba(255,255,255,0.06);
  --border2: rgba(255,255,255,0.11);
  --border3: rgba(255,255,255,0.18);
  --text: #eef0ff;
  --text2: #8892b4;
  --text3: #4a5278;
  --text4: #2e3557;
  --accent: #5b8fff;
  --accent2: rgba(91,143,255,0.15);
  --accent3: rgba(91,143,255,0.06);
  --accentH: #7aa3ff;
  --cyan: #00e5ff;
  --cyan2: rgba(0,229,255,0.12);
  --cyan3: rgba(0,229,255,0.05);
  --green: #00d68f;
  --green2: rgba(0,214,143,0.12);
  --red: #ff4d6d;
  --red2: rgba(255,77,109,0.12);

  --glow-cyan: 0 0 24px rgba(0,229,255,0.25);

html,body,#root { height:100%; font-family:var(--font-body); background:var(--bg); color:var(--text); overflow:hidden; }
::-webkit-scrollbar { width:3px; height:3px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border2); border-radius:2px; }

input,select,textarea,button { font-family:var(--font-body); }
input::placeholder,textarea::placeholder { color:var(--text3); }

/* Animations */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideRight{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideInRight{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
@keyframes glow-pulse{0%,100%{box-shadow:0 0 8px rgba(91,143,255,0.3)}50%{box-shadow:0 0 20px rgba(91,143,255,0.6)}}

@keyframes number-pop{0%{transform:scale(0.7);opacity:0}80%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}

.fade-in{animation:fadeIn 0.25s ease forwards}
.slide-up{animation:slideUp 0.3s cubic-bezier(0.34,1.4,0.64,1) forwards}
.slide-right{animation:slideRight 0.3s ease forwards}
.slide-in-right{animation:slideInRight 0.3s ease forwards}
.spin{animation:spin 0.8s linear infinite;display:inline-block}
.pulse{animation:pulse 2s ease-in-out infinite}
.stagger>*{animation:slideUp 0.25s ease forwards;opacity:0}
.stagger>*:nth-child(1){animation-delay:.04s}.stagger>*:nth-child(2){animation-delay:.08s}
.stagger>*:nth-child(3){animation-delay:.12s}.stagger>*:nth-child(4){animation-delay:.16s}

.btn-danger{background:var(--red2);color:var(--red);border:1px solid rgba(255,77,109,0.25)}

.bg-orb-2{width:500px;height:500px;background:radial-gradient(circle,rgba(0,229,255,0.03) 0%,transparent 70%);bottom:-100px;left:-100px}

.lead-card.selected{border-color:var(--accent)!important;background:rgba(91,143,255,0.06)!important}

/* Sidebar section */
.sidebar-section{padding:14px 16px;border-bottom:1px solid var(--border)}
.sidebar-label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;display:block;margin-bottom:7px}

/* Stat card */
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px 14px;transition:all 0.18s}
.stat-card:hover{border-color:var(--border2);background:var(--surface2)}

/* Tag */
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:11px;background:var(--accent3);color:var(--accent);border:1px solid rgba(91,143,255,0.2)}

/* Scrollable area */
.scroll-area{overflow-y:auto;scrollbar-width:thin}

/* Radar animation for searching */
.radar-ring{position:absolute;width:60px;height:60px;border-radius:50%;border:2px solid var(--accent);animation:radar 1.5s ease-out infinite}
.radar-ring:nth-child(2){animation-delay:0.5s}
.radar-ring:nth-child(3){animation-delay:1s}

/* Map cluster */
.cluster-label{background:var(--accent);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;border:2px solid rgba(255,255,255,0.3)}

/* Progress bar */
.progress-bar{height:3px;background:var(--surface);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;border-radius:2px;transition:width 0.5s ease}
</style>

// ─── Maps Loader ─────────────────────────────────────────────────────────────
let mapsPromise = null;
const loadMaps = () => {
  if (window.google?.maps) return Promise.resolve();
  if (mapsPromise) return mapsPromise;
  mapsPromise = new Promise((res, rej) => {
    const s = document.createElement("script");

// ─── Lead Scoring ─────────────────────────────────────────────────────────────
function scoreLeadData(lead) {
  let score = 0;
  if (lead.rating >= 4.5) score += 30;
  else if (lead.rating >= 4.0) score += 20;
  else if (lead.rating >= 3.5) score += 10;
  if (lead.user_ratings_total >= 100) score += 25;
  else if (lead.user_ratings_total >= 50) score += 15;
  else if (lead.user_ratings_total >= 20) score += 8;
  if (lead.website) score += 15;
  if (lead.phone || lead.international_phone_number) score += 10;
  if (lead.price_level > 0) score += 5;
  return Math.min(score, 99);
}

function getScoreColor(score) {
  if (score >= 70) return "#00d68f";
  if (score >= 45) return "#ffb43a";
  return "#ff4d6d";
}

let _toast = null;
function Toaster() {
  const [list, setList] = useState([]);
  useEffect(() => {
    _toast = (msg, type="info", duration=3000) => {
      const id = Date.now();
      setList(t=>[...t.slice(-3),{id,msg,type}]);
      setTimeout(()=>setList(t=>t.filter(x=>x.id!==id)), duration);
    };
  }, []);
  const C = {info:"var(--accent)",success:"var(--green)",error:"var(--red)",warning:"var(--gold)"};

}

    const h = () => setReady(true);
    window.addEventListener("fb-ready", h);
    return () => window.removeEventListener("fb-ready", h);
  }, []);
  return ready ? window.__fb : null;
}

// ─── useLeads Hook ───────────────────────────────────────────────────────────
function useLeads(fb) {
  const [leads, setLeads] = useState([]);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    if (!fb) return;
    const unsub = fb.subscribeLeads(data => { setLeads(data); setLoading(false); });
    return unsub;
  }, [fb]);
  const saveLeads = useCallback(async (arr) => {
    if (!fb) return;
    await Promise.all(arr.map(l => fb.addLead({...l, score: scoreLeadData(l)})));
    fb.trackEvent("bulk_save",{count:arr.length});
  }, [fb]);
  const updateLead = useCallback(async (id, upd) => fb?.updateLead(id, upd), [fb]);
  const deleteLead = useCallback(async (id) => fb?.deleteLead(id), [fb]);
  return { leads, loading, saveLeads, updateLead, deleteLead };
}

// ─── Map Component ───────────────────────────────────────────────────────────
function MapPane({ center, radius, leads, onSelect, selected }) {
  const ref = useRef(); const mapRef = useRef(); const circleRef = useRef();
  const markers = useRef([]); const iwRef = useRef();

  useEffect(() => {
    if (!ref.current || !window.google) return;
    mapRef.current = new window.google.maps.Map(ref.current, {
      center, zoom:13,
      mapTypeControl:false, streetViewControl:false, fullscreenControl:true,
      zoomControl:true, scaleControl:false,
      zoomControlOptions:{ position: window.google.maps.ControlPosition.RIGHT_BOTTOM },
      fullscreenControlOptions:{ position: window.google.maps.ControlPosition.RIGHT_TOP },
      styles: DARK_MAP_STYLES,
      gestureHandling:"greedy"
    });
    iwRef.current = new window.google.maps.InfoWindow({maxWidth:240});
  }, []);

  useEffect(() => {
    if (!mapRef.current || !window.google) return;
    mapRef.current.setCenter(center);
    if (circleRef.current) circleRef.current.setMap(null);
    circleRef.current = new window.google.maps.Circle({
      map: mapRef.current, center, radius: radius * 1000,
      fillColor:"#5b8fff", fillOpacity:0.05,
      strokeColor:"#5b8fff", strokeOpacity:0.4, strokeWeight:1.5,
      strokeDashArray:"4 4"
    });
    mapRef.current.fitBounds(circleRef.current.getBounds());
  }, [center, radius]);

  useEffect(() => {
    if (!mapRef.current || !window.google) return;
    markers.current.forEach(m => m.setMap(null));
    markers.current = [];
    leads.forEach(lead => {
      const loc = lead.geometry?.location;
      if (!loc) return;
      const pos = { lat: typeof loc.lat==="function"?loc.lat():loc.lat, lng: typeof loc.lng==="function"?loc.lng():loc.lng };
      const cfg = STATUS_CONFIG[lead.status||"new"];
      const isSelected = selected?.place_id === lead.place_id;
      const score = lead.score || scoreLeadData(lead);
      const scoreColor = getScoreColor(score);
      const m = new window.google.maps.Marker({
        map: mapRef.current, position: pos, title: lead.name,
        icon: {
          path: window.google.maps.SymbolPath.CIRCLE,
          scale: isSelected ? 11 : 8,
          fillColor: isSelected ? "#fff" : cfg.color,
          fillOpacity: 1,
          strokeColor: isSelected ? cfg.color : "#070810",
          strokeWeight: isSelected ? 3 : 2,
        },
        zIndex: isSelected ? 100 : 1,
        animation: isSelected ? window.google.maps.Animation.BOUNCE : null
      });
      m.addListener("click", () => {
        onSelect(lead);
        iwRef.current.setContent(`
          <div style="font-family:'Outfit',sans-serif;padding:10px;max-width:220px;background:#111224;color:#eef0ff;border-radius:8px">
            <p style="margin:0 0 4px;font-weight:700;font-size:13px;line-height:1.3">${lead.name}</p>
            <p style="margin:0 0 8px;font-size:11px;color:#8892b4;line-height:1.4">${lead.vicinity||""}</p>
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              ${lead.rating?`<span style="font-size:11px;color:#ffb43a">★ ${lead.rating}</span>`:""}
              ${lead.user_ratings_total?`<span style="font-size:10px;color:#6b7591">${lead.user_ratings_total} reviews</span>`:""}
              <span style="font-size:10px;font-weight:700;color:${scoreColor};background:${scoreColor}18;padding:1px 6px;border-radius:10px">⬡ ${score}</span>
            </div>
            ${lead.phone?`<p style="margin:6px 0 0;font-size:11px;color:#5b8fff">📞 ${lead.phone}</p>`:""}
          </div>
        `);
        iwRef.current.open(mapRef.current, m);
      });
      markers.current.push(m);
    });
  }, [leads, onSelect, selected]);

  return <div ref={ref} style={{width:"100%",height:"100%"}} />;
}

// ─── Search Panel ─────────────────────────────────────────────────────────────
function SearchPanel({ onResults, onCenterChange, fb, onSearchStart }) {
  const [loc, setLoc] = useState("");
  const [coords, setCoords] = useState(null);
  const [radius, setRadius] = useState(2);
  const [type, setType] = useState("restaurant");
  const [keyword, setKeyword] = useState("");
  const [minRating, setMinRating] = useState(0);
  const [searching, setSearching] = useState(false);
  const [progress, setProgress] = useState(0);
  const [count, setCount] = useState(null);
  const [history, setHistory] = useState([]);
  const [showHistory, setShowHistory] = useState(false);
  const [mapsReady, setMapsReady] = useState(false);
  const inputRef = useRef();
  const progressRef = useRef();

  useEffect(() => {
    loadMaps().then(() => {
      setMapsReady(true);
      if (inputRef.current) {
        const ac = new window.google.maps.places.Autocomplete(inputRef.current, {
          types:["geocode","establishment"]
        });
        ac.addListener("place_changed", () => {
          const p = ac.getPlace();
          if (p.geometry) {
            const c = { lat:p.geometry.location.lat(), lng:p.geometry.location.lng() };
            setLoc(p.formatted_address||p.name);
            setCoords(c); onCenterChange(c);
          }
        });
      }
    }).catch(()=>{});
    if (fb) fb.getSearchHistory().then(setHistory).catch(()=>{});
  }, [fb]);

  const doSearch = async () => {
    if (!coords) { toast("Enter a location first","warning"); return; }
    if (!mapsReady) { toast("Maps loading, try again...","warning"); return; }
    setSearching(true); setCount(null); setProgress(10); onSearchStart?.();
    try {
      const ll = new window.google.maps.LatLng(coords.lat, coords.lng);
      const svc = new window.google.maps.places.PlacesService(document.createElement("div"));
      const req = { location:ll, radius:radius*1000, type };
      if (keyword.trim()) req.keyword = keyword.trim();

      setProgress(30);
      const { results, pagination } = await new Promise((res,rej) =>
        svc.nearbySearch(req, (r,s,p) => s==="OK"||s==="ZERO_RESULTS" ? res({results:r||[],pagination:p}) : rej(new Error(s)))
      );

      setProgress(60);
      let all = [...results];

      if (pagination?.hasNextPage) {
        setProgress(75);
        const more = await new Promise(res =>
          setTimeout(()=>pagination.nextPage((r,s)=>res(s==="OK"?r:[])), 2000)
        );
        all = [...all, ...more];
      }

      setProgress(90);
      if (minRating > 0) all = all.filter(r => (r.rating||0) >= minRating);

      const enriched = all.map(r => ({ ...r, score: scoreLeadData(r) }));
      enriched.sort((a,b) => (b.score||0)-(a.score||0));

      setProgress(100);
      setCount(enriched.length);
      onResults(enriched, coords, radius);
      if (fb) fb.addSearchHistory({ location:loc, coords, radius, type, keyword, minRating, resultCount:enriched.length }).catch(()=>{});
      fb?.trackEvent("search",{type,radius,count:enriched.length});
      toast(`Found ${enriched.length} businesses — sorted by score!`, "success");
    } catch(err) {
      toast("Search failed: "+err.message, "error");
    } finally {
      setSearching(false);
      setTimeout(()=>setProgress(0), 800);
    }
  };

  const useMyLocation = () => {
    if (!navigator.geolocation) { toast("Geolocation not supported","error"); return; }
    navigator.geolocation.getCurrentPosition(pos => {
      const c = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      setCoords(c); onCenterChange(c); setLoc("My Location");
      toast("Location detected!","success");
    }, () => toast("Location access denied","error"));
  };

  return (
    <div style={{display:"flex",flexDirection:"column",height:"100%"}}>
      {/* Search progress */}
      {progress > 0 && <div className="progress-bar" style={{position:"absolute",top:0,left:0,right:0,zIndex:50}}>
        <div className="progress-fill" style={{width:`${progress}%`,background:"linear-gradient(90deg,var(--accent),var(--cyan))"}}/>
      </div>}

      <div className="scroll-area" style={{flex:1,padding:"14px 14px 8px"}}>

        {/* Logo area */}
        <div style={{marginBottom:16,paddingBottom:14,borderBottom:"1px solid var(--border)"}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:4}}>
            <div style={{width:32,height:32,borderRadius:10,background:"linear-gradient(135deg,var(--accent),#3d6ee8)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,boxShadow:"var(--glow-accent)"}}>🎯</div>
            <div>
              <p style={{fontSize:15,fontWeight:800,fontFamily:"var(--font-head)",color:"var(--text)",letterSpacing:"-0.02em",lineHeight:1}}>LeadHunter<span style={{color:"var(--accent)"}}>Pro</span></p>
              <p style={{fontSize:9,color:"var(--text3)",letterSpacing:"0.1em",textTransform:"uppercase",marginTop:1}}>Smart Lead Finder</p>
            </div>
          </div>
          {!fb && <div style={{fontSize:10,color:"var(--gold)",background:"var(--gold2)",border:"1px solid rgba(255,180,58,0.25)",padding:"4px 8px",borderRadius:7,display:"inline-flex",alignItems:"center",gap:4}}>
            <span className="pulse" style={{width:5,height:5,borderRadius:"50%",background:"var(--gold)",display:"inline-block"}}/>
            Connecting to database...
          </div>}
        </div>

        {/* Location */}
        <div style={{marginBottom:11}}>
          <label className="sidebar-label">📍 Location</label>
          <div style={{position:"relative"}}>
            <input ref={inputRef} className="input-field" value={loc} onChange={e=>setLoc(e.target.value)} placeholder="City, address, or place name..." style={{paddingRight:36}}/>
            <button onClick={useMyLocation} style={{position:"absolute",right:6,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",color:"var(--text3)",fontSize:15,padding:2}} data-tip="Use my location">⊕</button>
          </div>
        </div>

        {/* Business Type */}
        <div style={{marginBottom:11}}>
          <label className="sidebar-label">🏢 Business Type</label>
          <select className="input-field" value={type} onChange={e=>setType(e.target.value)} style={{background:"var(--surface)"}}>
            {BUSINESS_CATEGORIES.map(g=><optgroup key={g.group} label={g.group}>
              {g.types.map(t=><option key={t.value} value={t.value}>{t.icon} {t.label}</option>)}
            </optgroup>)}
          </select>
        </div>

        {/* Keyword */}
        <div style={{marginBottom:11}}>
          <label className="sidebar-label">🔤 Keyword <span style={{fontWeight:400,textTransform:"none"}}>(optional)</span></label>
          <input className="input-field" value={keyword} onChange={e=>setKeyword(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doSearch()} placeholder="e.g. Italian, luxury, fast..." />
        </div>

        {/* Radius */}
        <div style={{marginBottom:11}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
            <label className="sidebar-label" style={{marginBottom:0}}>📏 Search Radius</label>
            <span style={{fontSize:12,fontWeight:700,color:"var(--accent)",fontFamily:"var(--font-mono)"}}>{radius} km</span>
          </div>
          <input type="range" min="0.5" max="50" step="0.5" value={radius} onChange={e=>setRadius(+e.target.value)}
            style={{width:"100%",accentColor:"var(--accent)",cursor:"pointer",height:4}}/>
          <div style={{display:"flex",justifyContent:"space-between",marginTop:3}}>
            <span style={{fontSize:10,color:"var(--text4)"}}>0.5 km</span>
            <span style={{fontSize:10,color:"var(--text4)"}}>50 km</span>
          </div>
        </div>

        {/* Min Rating */}
        <div style={{marginBottom:14}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
            <label className="sidebar-label" style={{marginBottom:0}}>⭐ Min Rating</label>
            <span style={{fontSize:12,fontWeight:700,color:"var(--gold)",fontFamily:"var(--font-mono)"}}>{minRating>0?`${minRating}+`:"Any"}</span>
          </div>
          <div style={{display:"flex",gap:5}}>
            {[0,3,3.5,4,4.5].map(v=>(
              <button key={v} onClick={()=>setMinRating(v)}
                style={{flex:1,padding:"5px 3px",borderRadius:7,border:`1px solid ${minRating===v?"var(--gold)":"var(--border)"}`,background:minRating===v?"var(--gold2)":"var(--surface)",color:minRating===v?"var(--gold)":"var(--text3)",fontSize:10,fontWeight:600,cursor:"pointer",fontFamily:"var(--font-body)"}}>
                {v===0?"Any":`${v}★`}
              </button>
            ))}
          </div>
        </div>

        {/* Search Button */}
        <button onClick={doSearch} disabled={searching||!mapsReady} className="btn btn-primary"
          style={{width:"100%",padding:12,fontSize:13,fontWeight:700,letterSpacing:"0.02em",marginBottom:10}}>
          {searching
            ? <><div style={{width:14,height:14,border:"2px solid rgba(255,255,255,0.3)",borderTop:"2px solid #fff",borderRadius:"50%"}} className="spin"/> Scanning area...</>
            : <><span style={{fontSize:15}}>🎯</span> Hunt Leads</>
          }
        </button>

        {/* Result count bubble */}
        {count !== null && <div className="fade-in" style={{background:"linear-gradient(135deg,var(--accent3),var(--cyan3))",border:"1px solid var(--accent2)",borderRadius:"var(--r)",padding:"12px 14px",textAlign:"center",marginBottom:12}}>
          <div style={{display:"flex",justifyContent:"center",gap:20}}>
            <div>
              <p style={{fontSize:26,fontWeight:800,fontFamily:"var(--font-head)",color:"var(--accent)",lineHeight:1}}>{count}</p>
              <p style={{fontSize:10,color:"var(--text2)",marginTop:2}}>businesses found</p>
            </div>
          </div>
        </div>}

        {/* Search History */}
        <div>
          <button onClick={()=>setShowHistory(p=>!p)} style={{width:"100%",background:"none",border:"none",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",color:"var(--text3)",fontSize:11}}>
            <span style={{fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em"}}>🕐 Search History</span>
            <span>{showHistory?"▲":"▼"}</span>
          </button>
          {showHistory && history.length > 0 && <div style={{display:"flex",flexDirection:"column",gap:4,marginTop:6}}>
            {history.slice(0,8).map(h=>(
              <button key={h.id} onClick={()=>{
                setLoc(h.location||""); setCoords(h.coords);
                setRadius(h.radius||2); setType(h.type||"restaurant");
                setKeyword(h.keyword||""); setMinRating(h.minRating||0);
                if(h.coords) onCenterChange(h.coords);
              }} className="btn btn-ghost" style={{justifyContent:"flex-start",fontSize:11,padding:"6px 9px",textAlign:"left"}}>
                <div style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",flex:1}}>
                  <span style={{color:"var(--text)"}}>{h.location||"Unknown"}</span>
                  <span style={{color:"var(--text3)",marginLeft:6}}>{h.type} · {h.radius}km</span>
                </div>
                {h.resultCount != null && <span style={{fontSize:10,color:"var(--accent)",marginLeft:6,flexShrink:0}}>{h.resultCount}</span>}
              </button>
            ))}
          </div>}
          {showHistory && history.length === 0 && <p style={{fontSize:11,color:"var(--text3)",padding:"8px 0"}}>No history yet</p>}
        </div>

      </div>
    </div>
  );
}

// ─── Pipeline Stats Bar ────────────────────────────────────────────────────────
function PipelineStats({ leads }) {
  const counts = useMemo(()=>{
    const c={total:leads.length,avgScore:0,withContact:0};
    Object.keys(STATUS_CONFIG).forEach(s=>c[s]=0);
    let totalScore=0;
    leads.forEach(l=>{
      const s=l.status||"new"; c[s]=(c[s]||0)+1;
      totalScore+=(l.score||0);
      if(l.phone||l.website) c.withContact++;
    });
    c.avgScore=leads.length?Math.round(totalScore/leads.length):0;
    return c;
  },[leads]);

  return (
    <div style={{padding:"8px 14px",borderBottom:"1px solid var(--border)",display:"flex",gap:6,overflowX:"auto",flexShrink:0,background:"var(--bg2)"}}>
      <div style={{display:"flex",alignItems:"center",gap:10,paddingRight:10,borderRight:"1px solid var(--border)",flexShrink:0,marginRight:2}}>
        <div>
          <p style={{fontSize:16,fontWeight:800,fontFamily:"var(--font-head)",color:"var(--text)",lineHeight:1}}>{counts.total}</p>
          <p style={{fontSize:9,color:"var(--text3)",textTransform:"uppercase",letterSpacing:"0.06em"}}>Total</p>
        </div>
        <div>
          <p style={{fontSize:16,fontWeight:800,fontFamily:"var(--font-head)",color:getScoreColor(counts.avgScore),lineHeight:1}}>{counts.avgScore}</p>
          <p style={{fontSize:9,color:"var(--text3)",textTransform:"uppercase",letterSpacing:"0.06em"}}>Avg Score</p>
        </div>
      </div>
      {Object.entries(STATUS_CONFIG).map(([s,cfg])=>counts[s]>0&&(
        <div key={s} style={{display:"flex",alignItems:"center",gap:5,padding:"3px 9px",borderRadius:20,background:cfg.bg,border:`1px solid ${cfg.color}33`,flexShrink:0,cursor:"default"}} data-tip={cfg.label}>
          <span style={{fontSize:14,fontWeight:800,fontFamily:"var(--font-head)",color:cfg.color}}>{counts[s]}</span>
          <span style={{fontSize:9,color:cfg.color,opacity:0.8}}>{cfg.label}</span>
        </div>
      ))}
    </div>
  );
}

// ─── App ──────────────────────────────────────────────────────────────────────
function App() {
  const fb = useFirebase();
  const { leads, loading, saveLeads, updateLead, deleteLead } = useLeads(fb);
  const [center, setCenter] = useState({lat:40.7128,lng:-74.006});
  const [radius, setRadius] = useState(2);
  const [results, setResults] = useState([]);
  const [selected, setSelected] = useState(null);
  const [tab, setTab] = useState("search");
  const [view, setView] = useState("split");
  const [filterStatus, setFilterStatus] = useState("all");
  const [filterText, setFilterText] = useState("");
  const [sort, setSort] = useState("score");
  const [saving, setSaving] = useState(false);
  const [mapsReady, setMapsReady] = useState(false);
  const [checkedIds, setCheckedIds] = useState(new Set());
  const [showCheck, setShowCheck] = useState(false);

  useEffect(() => { loadMaps().then(()=>setMapsReady(true)).catch(()=>{}); }, []);

  const handleResults = useCallback((r, c, rad) => {
    setResults(r); setCenter(c); setRadius(rad); setTab("search"); setSelected(null); setCheckedIds(new Set());
  }, []);

  const handleSaveAll = async () => {
    if (!results.length||!fb) return;
    setSaving(true);
    try {
      const toSave = results.map(r=>({
        name:r.name, vicinity:r.vicinity||"",
        rating:r.rating||null, user_ratings_total:r.user_ratings_total||null,
        place_id:r.place_id, types:r.types||[],
        website:r.website||"", phone:r.international_phone_number||"",
        score: scoreLeadData(r),
        geometry:{ location:{ lat:typeof r.geometry?.location?.lat==="function"?r.geometry.location.lat():r.geometry?.location?.lat, lng:typeof r.geometry?.location?.lng==="function"?r.geometry.location.lng():r.geometry?.location?.lng } }
      }));
      await saveLeads(toSave);
      toast(`${results.length} leads saved to pipeline!`, "success");
      setTab("leads"); setResults([]);
    } catch(e) { toast("Save failed: "+e.message,"error"); }
    finally { setSaving(false); }
  };

  const handleSaveSelected = async () => {
    if (!fb||checkedIds.size===0) return;
    setSaving(true);
    try {
      const toSave = results.filter(r=>checkedIds.has(r.place_id)).map(r=>({
        name:r.name, vicinity:r.vicinity||"",
        rating:r.rating||null, user_ratings_total:r.user_ratings_total||null,
        place_id:r.place_id, types:r.types||[],
        website:r.website||"", phone:r.international_phone_number||"",
        score: scoreLeadData(r),
        geometry:{ location:{ lat:typeof r.geometry?.location?.lat==="function"?r.geometry.location.lat():r.geometry?.location?.lat, lng:typeof r.geometry?.location?.lng==="function"?r.geometry.location.lng():r.geometry?.location?.lng } }
      }));
      await saveLeads(toSave);
      toast(`${toSave.length} selected leads saved!`, "success");
      setTab("leads"); setResults([]);
    } catch(e) { toast("Save failed","error"); }
    finally { setSaving(false); }
  };

  const exportCSV = () => {
    const src = tab==="search"?results:filteredLeads;
    if (!src.length) { toast("Nothing to export","warning"); return; }
    const rows=[["Name","Address","Rating","Reviews","Score","Status","Phone","Website","Tags"]];
    src.forEach(l=>rows.push([l.name,l.vicinity||"",l.rating||"",l.user_ratings_total||"",l.score||scoreLeadData(l),l.status||"new",l.phone||"",l.website||"",(l.tags||[]).join("; ")]));
    const csv=rows.map(r=>r.map(c=>`"${String(c||"").replace(/"/g,'""')}"`).join(",")).join("\n");
    const a=document.createElement("a"); a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv); a.download=`leadhunter-export-${Date.now()}.csv`; a.click();
    toast("CSV exported!","success");
  };

  const bulkStatusUpdate = async (newStatus) => {
    if (!fb||checkedIds.size===0) return;
    const ids = Array.from(checkedIds);
    await Promise.all(ids.map(id => updateLead(id, {status:newStatus})));
    toast(`${ids.length} leads updated to ${STATUS_CONFIG[newStatus].label}`, "success");
    setCheckedIds(new Set());
  };

  const bulkDelete = async () => {
    if (!fb||checkedIds.size===0) return;
    if (!window.confirm(`Delete ${checkedIds.size} leads?`)) return;
    const ids = Array.from(checkedIds);
    await Promise.all(ids.map(id => deleteLead(id)));
    toast(`${ids.length} leads deleted`, "warning");
    setCheckedIds(new Set());
  };

  const sortedResults = useMemo(()=>{
    const list = [...results];
    if (sort==="score") list.sort((a,b)=>(b.score||scoreLeadData(b))-(a.score||scoreLeadData(a)));
    else if (sort==="rating") list.sort((a,b)=>(b.rating||0)-(a.rating||0));
    else if (sort==="reviews") list.sort((a,b)=>(b.user_ratings_total||0)-(a.user_ratings_total||0));
    else if (sort==="name") list.sort((a,b)=>a.name.localeCompare(b.name));
    return list;
  },[results,sort]);

  const filteredLeads = useMemo(()=>{
    let list = [...leads];
    if (filterStatus!=="all") list=list.filter(l=>(l.status||"new")===filterStatus);
    if (filterText) {
      const q=filterText.toLowerCase();
      list=list.filter(l=>l.name?.toLowerCase().includes(q)||l.vicinity?.toLowerCase().includes(q)||(l.tags||[]).some(t=>t.includes(q)));
    }
    if (sort==="score") list.sort((a,b)=>(b.score||0)-(a.score||0));
    else if (sort==="rating") list.sort((a,b)=>(b.rating||0)-(a.rating||0));
    else if (sort==="reviews") list.sort((a,b)=>(b.user_ratings_total||0)-(a.user_ratings_total||0));
    else if (sort==="name") list.sort((a,b)=>a.name.localeCompare(b.name));
    return list;
  },[leads,filterStatus,filterText,sort]);

  const display = tab==="search" ? sortedResults : filteredLeads;
  const displayLeads = display; // for map

  const allIds = tab==="search" ? results.map(r=>r.place_id) : filteredLeads.map(l=>l.id);
  const allSelected = allIds.length>0 && allIds.every(id=>checkedIds.has(id));

  const handleSelectAll = (checked) => {
    if (checked) setCheckedIds(new Set(allIds));
    else setCheckedIds(new Set());
  };

  return <>
    <Toaster/>
    <div style={{height:"100vh",display:"flex",flexDirection:"column",background:"var(--bg)",overflow:"hidden",position:"relative",zIndex:1}}>

      {/* Top Bar */}
      <div style={{height:50,background:"var(--bg2)",borderBottom:"1px solid var(--border)",display:"flex",alignItems:"center",padding:"0 14px",gap:10,flexShrink:0,boxShadow:"0 1px 0 var(--border)"}}>

        {/* Logo */}
        <div style={{display:"flex",alignItems:"center",gap:8,marginRight:6}}>
          <div style={{width:30,height:30,borderRadius:9,background:"linear-gradient(135deg,var(--accent),#2f5dcc)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,boxShadow:"var(--glow-accent)"}}>🎯</div>
          <div style={{lineHeight:1}}>
            <span style={{fontFamily:"var(--font-head)",fontWeight:800,fontSize:15,color:"var(--text)",letterSpacing:"-0.02em"}}>LeadHunter</span>
            <span style={{fontFamily:"var(--font-head)",fontWeight:800,fontSize:15,color:"var(--accent)",letterSpacing:"-0.02em"}}>Pro</span>
          </div>
          {!fb && <span style={{fontSize:9,color:"var(--gold)",background:"var(--gold2)",border:"1px solid rgba(255,180,58,0.3)",padding:"2px 7px",borderRadius:8,display:"flex",alignItems:"center",gap:3}}>
            <span className="spin" style={{width:8,height:8,border:"1.5px solid rgba(255,180,58,0.3)",borderTop:"1.5px solid var(--gold)",borderRadius:"50%",display:"inline-block"}}/>CONNECTING
          </span>}
        </div>

        {/* View toggle */}
        <div style={{display:"flex",background:"var(--surface)",border:"1px solid var(--border)",borderRadius:10,padding:3,gap:2}}>
          {[["split","⚡"],["map","🗺"],["list","≡"]].map(([v,l])=>(
            <button key={v} onClick={()=>setView(v)} title={v.charAt(0).toUpperCase()+v.slice(1)+" view"}
              style={{background:view===v?"var(--accent)":"transparent",color:view===v?"#fff":"var(--text3)",border:"none",borderRadius:7,padding:"4px 10px",fontSize:13,cursor:"pointer",transition:"all 0.15s",fontFamily:"var(--font-body)",fontWeight:view===v?700:400}}>
              {l}
            </button>
          ))}
        </div>

        {/* Spacer */}
        <div style={{flex:1}}/>

        {/* Actions */}
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          {tab==="search"&&results.length>0&&<>
            {checkedIds.size>0&&<button onClick={handleSaveSelected} disabled={saving||!fb} className="btn btn-success btn-sm">{saving?"...":` Save ${checkedIds.size} selected`}</button>}
            <button onClick={handleSaveAll} disabled={saving||!fb} className="btn btn-primary btn-sm" style={{fontSize:12}}>
              {saving?<><div style={{width:12,height:12,border:"1.5px solid rgba(255,255,255,0.3)",borderTop:"1.5px solid #fff",borderRadius:"50%"}} className="spin"/>Saving...</>:`💾 Save All (${results.length})`}
            </button>
          </>}
          <button onClick={exportCSV} className="btn btn-ghost btn-icon" title="Export CSV" style={{fontSize:13}}>↓CSV</button>
        </div>
      </div>

      {/* Body */}
      <div style={{flex:1,display:"flex",overflow:"hidden"}}>

        {/* Sidebar */}
        <div style={{width:252,flexShrink:0,borderRight:"1px solid var(--border)",overflowY:"hidden",background:"var(--bg2)",display:"flex",flexDirection:"column",position:"relative"}}>
          <SearchPanel onResults={handleResults} onCenterChange={setCenter} fb={fb} onSearchStart={()=>setSelected(null)}/>
        </div>

        {/* Main Content */}
        <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>

          {/* Tabs */}
          <div style={{display:"flex",borderBottom:"1px solid var(--border)",background:"var(--bg2)",flexShrink:0,alignItems:"center",paddingLeft:2}}>
            <button className={`tab-btn${tab==="search"?" active":""}`} onClick={()=>{setTab("search");setSelected(null);}}>
              🔍 Results {results.length>0&&<span className="badge">{results.length}</span>}
            </button>
            <button className={`tab-btn${tab==="leads"?" active":""}`} onClick={()=>{setTab("leads");setSelected(null);}}>
              💼 Pipeline {leads.length>0&&<span className="badge">{leads.length}</span>}
            </button>

            {tab==="leads"&&<>
              <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:6,paddingRight:10}}>
                <input className="input-field" value={filterText} onChange={e=>setFilterText(e.target.value)} placeholder="Search..." style={{width:130,height:28,fontSize:11,padding:"4px 10px"}}/>
                <select className="input-field" value={filterStatus} onChange={e=>setFilterStatus(e.target.value)} style={{width:112,height:28,fontSize:11,padding:"4px 8px",background:"var(--surface)"}}>
                  <option value="all">All Status</option>
                  {Object.entries(STATUS_CONFIG).map(([v,c])=><option key={v} value={v}>{c.label}</option>)}
                </select>
              </div>
            </>}
          </div>

          {tab==="leads"&&<PipelineStats leads={leads}/>}

          {/* Bulk action bar for results */}
          {tab==="search"&&showCheck&&<BulkActionsBar selected={checkedIds} onStatusChange={()=>{}} onDelete={()=>{}} onClear={()=>setCheckedIds(new Set())}/>}
          {tab==="leads"&&showCheck&&<BulkActionsBar selected={checkedIds} onStatusChange={bulkStatusUpdate} onDelete={bulkDelete} onClear={()=>setCheckedIds(new Set())}/>}

          {/* Pane area */}
          <div style={{flex:1,display:"flex",overflow:"hidden",position:"relative"}}>

            {/* Map */}
            {(view==="split"||view==="map")&&(
              <div style={{flex:view==="map"?1:"0 0 54%",position:"relative",overflow:"hidden",borderRight:view==="split"?"1px solid var(--border)":"none"}}>
                {mapsReady
                  ? <MapPane center={center} radius={radius} leads={displayLeads} onSelect={s=>{setSelected(s);}} selected={selected}/>
                  : <MapPlaceholder/>
                }
              </div>
            )}

            {/* List */}
            {(view==="split"||view==="list")&&(
              <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden",background:"var(--bg2)",position:"relative"}}>
                <ResultsToolbar
                  count={display.length} sort={sort} onSortChange={setSort}
                  filter={tab==="search"?"":filterText} onFilter={tab==="leads"?setFilterText:()=>{}}
                  onSelectAll={handleSelectAll} allSelected={allSelected}
                  showCheck={showCheck} onToggleCheck={()=>{setShowCheck(p=>!p);setCheckedIds(new Set());}}
                />

                <div className="scroll-area" style={{flex:1,position:"relative"}}>
                  {display.length === 0
                    ? <EmptyState tab={tab} loading={loading}/>
                    : <div className="stagger" style={{padding:"10px 10px"}}>
                        {display.map(lead=>(
                          <LeadCard key={lead.id||lead.place_id} lead={lead}
                            selected={selected?.place_id===lead.place_id}
                            onClick={()=>setSelected(selected?.place_id===lead.place_id?null:lead)}
                            onStatus={(id,s)=>updateLead(id,s?{status:s}:{})}
                            checked={checkedIds.has(lead.id||lead.place_id)}
                            onCheck={(v)=>{
                              const id=lead.id||lead.place_id;
                              setCheckedIds(prev=>{const n=new Set(prev);v?n.add(id):n.delete(id);return n;});
                            }}
                            showCheck={showCheck}
                          />
                        ))}
                      </div>
                  }
                  {selected&&(
                    <div style={{position:"absolute",inset:0}}>
                      <DetailDrawer lead={selected} onClose={()=>setSelected(null)} onUpdate={updateLead} onDelete={deleteLead} fb={fb}/>
                    </div>
                  )}
                </div>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  </>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
